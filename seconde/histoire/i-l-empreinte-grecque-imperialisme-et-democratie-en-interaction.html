      window.localStorage.setItem("__hggsp_probe__", "1");
      window.localStorage.removeItem("__hggsp_probe__");
      return true;
    } catch (e) {
      return false;
    }
  })();

  var LS_KEY = "hggsp-exercise-" + (data.id || "default");

  function loadProgress() {
    if (!storageOk) return {};
    try {
      return JSON.parse(window.localStorage.getItem(LS_KEY) || "{}");
    } catch (e) {
      return {};
    }
  }

  function saveProgress(p) {
    progress = p;
    if (!storageOk) return;
    try {
      window.localStorage.setItem(LS_KEY, JSON.stringify(p));
    } catch (e) {}
  }

  // Enregistre la progression d'un type sans écraser celle des autres types
  // (le fichier exporté peut contenir plusieurs exercices).
  function saveTypeProgress(type, patch) {
    var p = loadProgress();
    p[type] = Object.assign({}, p[type] || {}, patch);
    saveProgress(p);
  }

  var progress = loadProgress();

  // Utilitaires internes exposés au module QCM autonome (runtime-qcm.js),
  // chargé dans le même fichier exporté.
  window.__hggspRt = {
    h: h,
    esc: esc,
    shuffle: shuffle,
    richHtml: richHtml,
    setProgressText: setProgressText,
    saveTypeProgress: saveTypeProgress,
    progress: progress,
  };

  /* ---------- figurés (formes des repères) ---------- */
  function symbolOf(marker, cfg) {
    if (marker && marker.symbol) return marker.symbol;
    return (cfg && cfg.defaultSymbol) || "circle";
  }

  /* ---------- style des figurés : taille / couleur / opacité ---------- */
  function markerStyleOf(marker) {
    var s = marker && marker.size;
    var c = marker && marker.color;
    var o = marker && marker.opacity;
    var w = marker && marker.width;
    var h = marker && marker.height;
    var rect = !!(marker && marker.symbol === "rect");
    return {
      size: typeof s === "number" && s >= 8 && s <= 80 ? Math.round(s) : 22,
      color:
        typeof c === "string" && /^#[0-9a-f]{3,8}$/i.test(c.trim())
          ? c.trim()
          : "#2563eb",
      opacity: typeof o === "number" ? Math.max(0.1, Math.min(1, o)) : 1,
      rect: rect,
      width:
        rect && typeof w === "number" && w >= 16 && w <= 200
          ? Math.round(w)
          : 48,
      height:
        rect && typeof h === "number" && h >= 16 && h <= 200
          ? Math.round(h)
          : 32,
    };
  }

  /* ---------- utilitaires ---------- */
  function h(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v == null) return;
        if (k === "class") node.className = v;
        else if (k === "text") node.textContent = v;
        else if (k === "html") node.innerHTML = v;
        else node.setAttribute(k, String(v));
      });
    }
    if (children != null) {
      (Array.isArray(children) ? children : [children]).forEach(function (c) {
        if (c == null) return;
        node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
      });
    }
    return node;
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[c];
    });
  }

  function shuffle(arr) {
    var r = arr.slice();
    for (var i = r.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = r[i];
      r[i] = r[j];
      r[j] = tmp;
    }
    return r;
  }

  function formatYear(y) {
    if (y < 0) return -y + " av. J.-C.";
    if (y === 0) return "1 av. J.-C.";
    return String(y);
  }

  // Comparaison tolérante (minuscules, sans accents) pour les mots à trous.
  function normWord(s) {
    return String(s == null ? "" : s)
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .trim();
  }

  // Réponses attendues d'un texte à trous : les mots entre crochets [réponse].
  function parseGaps(text) {
    var out = [];
    var re = /\[([^\]]+)\]/g;
    var m;
    while ((m = re.exec(text))) {
      var w = String(m[1]).trim();
      if (w) out.push(w);
    }
    return out;
  }

  // Découpe un texte à trous en segments texte / trous (avec leurs réponses).
  function splitGapsText(text) {
    var out = [];
    var re = /\[([^\]]+)\]/g;
    var last = 0;
    var idx = 0;
    var m;
    while ((m = re.exec(text))) {
      if (m.index > last)
        out.push({ type: "text", s: text.slice(last, m.index) });
      out.push({ type: "gap", answer: String(m[1]).trim(), index: idx++ });
      last = m.index + m[0].length;
    }
    if (last < text.length) out.push({ type: "text", s: text.slice(last) });
    return out;
  }

  function distanceKm(lat1, lng1, lat2, lng2) {
    var R = 6371;
    var rad = Math.PI / 180;
    var dLat = (lat2 - lat1) * rad;
    var dLng = (lng2 - lng1) * rad;
    var a =
      Math.pow(Math.sin(dLat / 2), 2) +
      Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.pow(Math.sin(dLng / 2), 2);
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  /* ---------- notions cliquables ---------- */
  var notions = (data.notions || []).filter(function (n) {
    return n && n.term;
  });
  var termsSorted = notions.slice().sort(function (a, b) {
    return b.term.length - a.term.length;
  });

  function richHtml(text) {
    var s = esc(text);
    if (!termsSorted.length) return s;
    var out = "";
    var i = 0;
    while (i < s.length) {
      var best = null;
      for (var t = 0; t < termsSorted.length; t++) {
        var term = termsSorted[t].term;
        if (!term) continue;
        var idx = s.toLowerCase().indexOf(term.toLowerCase(), i);
        if (idx >= 0 && (best === null || idx < best.idx)) {
          best = { idx: idx, notion: termsSorted[t] };
        }
      }
      if (!best) {
        out += s.slice(i);
        break;
      }
      out += s.slice(i, best.idx);
      out +=
        '<button type="button" class="notion-chip" data-notion="' +
        esc(best.notion.id) +
        '">' +
        esc(best.notion.term) +
        "</button>";
      i = best.idx + best.notion.term.length;
    }
    return out;
  }

  /* ---------- modale notion (accessible clavier) ---------- */
  var lastFocused = null;

  function openNotion(id) {
    var notion = null;
    for (var i = 0; i < notions.length; i++) {
      if (notions[i].id === id) {
        notion = notions[i];
        break;
      }
    }
    if (!notion) return;
    lastFocused = document.activeElement;

    var overlay = h("div", { class: "overlay" });
    var modal = h("div", {
      class: "modal",
      role: "dialog",
      "aria-modal": "true",
      "aria-labelledby": "notion-modal-title",
    });
    var head = h("div", { class: "modal-head" });
    head.appendChild(h("h2", { text: "Notion du cours" }));
    var close = h("button", { class: "btn btn-ghost btn-sm", type: "button", text: "Fermer" });
    head.appendChild(close);

    var body = h("div", { class: "modal-body" });
    var term = h("p", { class: "modal-term", text: notion.term });
    term.id = "notion-modal-title";
    body.appendChild(term);
    if (notion.definition) {
      body.appendChild(h("div", { class: "modal-label", text: "Définition" }));
      body.appendChild(h("p", { html: richHtml(notion.definition) }));
    }
    if (notion.context) {
      body.appendChild(h("div", { class: "modal-label", text: "Contexte ou paradoxe" }));
      body.appendChild(h("p", { html: richHtml(notion.context) }));
    }

    modal.appendChild(head);
    modal.appendChild(body);
    overlay.appendChild(modal);

    function closeModal() {
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      document.removeEventListener("keydown", onKey, true);
      if (lastFocused && lastFocused.focus) lastFocused.focus();
    }

    function onKey(e) {
      if (e.key === "Escape") closeModal();
    }

    close.addEventListener("click", closeModal);
    overlay.addEventListener("click", function (e) {
      if (e.target === overlay) closeModal();
    });
    document.addEventListener("keydown", onKey, true);
    document.body.appendChild(overlay);
    close.focus();
  }

  // Phase de capture : le clic sur une notion ne sélectionne pas la carte en dessous.
  document.addEventListener(
    "click",
    function (e) {
      var chip = e.target && e.target.closest ? e.target.closest(".notion-chip") : null;
      if (chip) {
        e.stopPropagation();
        e.preventDefault();
        openNotion(chip.getAttribute("data-notion"));
      }
    },
    true
  );

  /* ---------- enveloppe ---------- */
  root.innerHTML = "";

  var themeClass =
    data.themeColor === "green"
      ? "green"
      : data.themeColor === "blue"
        ? "blue"
        : "red";

  var wrap = h("div", { class: "wrap" });
  root.appendChild(wrap);

  var head = h("header", { class: "exercise-head" });
  wrap.appendChild(head);

  head.appendChild(h("h1", { text: data.title || "Exercice de révision" }));
  // Consigne affichée à l'élève : mise à jour selon le type actif.
  var instrEl = h("p", { class: "instruction" });
  head.appendChild(instrEl);
  var meta = h("div", { class: "meta-line" });
  meta.appendChild(
    h("span", { class: "chip-theme " + themeClass, text: "Exercice de révision" })
  );
  var progressLine = h("span", {
    class: "progress-line",
    "aria-live": "polite",
    text: "",
  });
  meta.appendChild(progressLine);
  head.appendChild(meta);

  var body = h("div", { class: "exercise-body" });
  wrap.appendChild(body);

  function setProgressText(t) {
    progressLine.textContent = t || "";
  }

  /* ---------- sélecteur de sous-exercices ---------- */
  var currentMap = null;

  // Chaque sous-exercice rempli devient un onglet : appariement, flashcards,
  // et autant d'onglets que de cartes, de frises ou de textes à trous.
  var items = [];
  if ((data.pairs || []).length)
    items.push({ kind: "matching", index: 0, label: "Appariement" });
  if ((data.cards || []).length)
    items.push({ kind: "flashcards", index: 0, label: "Flashcards" });
  var maps = data.maps || [];
  maps.forEach(function (m, i) {
    if ((m.markers || []).length)
      items.push({
        kind: "map",
        index: i,
        label: maps.length > 1 ? "Repérage " + (i + 1) : "Repérage",
      });
  });
  var tls = data.timelines || [];
  tls.forEach(function (tl, i) {
    if (
      tl.imageDataUrl &&
      (((tl.markers || []).length > 0) || ((tl.zones || []).length > 0))
    )
      items.push({
        kind: "timeline",
        index: i,
        label:
          tls.length > 1
            ? "Frise " + (i + 1) + (tl.title ? " — " + tl.title : "")
            : tl.title || "Frise chronologique",
      });
  });
  var czs = data.clozes || [];
  czs.forEach(function (c, i) {
    if (parseGaps(c.text || "").length)
      items.push({
        kind: "cloze",
        index: i,
        label:
          czs.length > 1
            ? "Texte à trous " +
              (i + 1) +
              (c.title ? " — " + c.title : "")
            : c.title || "Texte à trous",
      });
  });
  var qcms = data.qcms || [];
  qcms.forEach(function (q, i) {
    if ((q.questions || []).length)
      items.push({
        kind: "qcm",
        index: i,
        label:
          qcms.length > 1
            ? "QCM " + (i + 1) + (q.title ? " — " + q.title : "")
            : q.title || "QCM — document",
      });
  });

  // Sous-exercice actif par défaut : data.start (prévisualisation), sinon le
  // type actif à l'export, sinon le premier sous-exercice rempli.
  function findItem(kind, index) {
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === kind && items[i].index === index) return items[i];
    }
    return null;
  }
  var activeItem = null;
  if (data.start) activeItem = findItem(data.start.kind, data.start.index);
  if (!activeItem) activeItem = findItem(data.type, 0);
  if (!activeItem) activeItem = items[0];
  if (!activeItem)
    activeItem = { kind: "matching", index: 0, label: "Appariement" };

  var tabsEl = h("nav", {
    class: "type-tabs",
    "aria-label": "Choisir l'exercice à faire",
  });
  items.forEach(function (it, i) {
    var btn = h("button", {
      type: "button",
      class: "type-tab" + (it === activeItem ? " active" : ""),
      "data-item": i,
      text: it.label,
    });
    btn.addEventListener("click", function () {
      startExercise(it);
    });
    tabsEl.appendChild(btn);
  });
  if (items.length > 0) head.appendChild(tabsEl);

  function instructionFor(kind) {
    return (data.instructions && data.instructions[kind]) || "";
  }

  function startExercise(item) {
    activeItem = item;
    var tabs = tabsEl.querySelectorAll(".type-tab");
    for (var i = 0; i < tabs.length; i++) {
      var itemIdx = Number(tabs[i].getAttribute("data-item"));
      tabs[i].classList.toggle("active", items[itemIdx] === item);
    }
    instrEl.innerHTML = richHtml(instructionFor(item.kind));
    if (currentMap) {
      try {
        currentMap.remove();
      } catch (e) {}
      currentMap = null;
    }
    body.className = "";
    body.innerHTML = "";
    if (item.kind === "matching") initMatching(body);
    else if (item.kind === "flashcards") initFlashcards(body);
    else if (item.kind === "map")
      initMap(body, maps[item.index] || {});
    else if (item.kind === "timeline")
      initTimeline(body, tls[item.index] || {});
    else if (item.kind === "cloze")
      initCloze(body, czs[item.index] || {});
    else if (item.kind === "qcm")
      window.__hggspQcm.init(body, qcms[item.index] || {});
    else {
      body.appendChild(
        h("p", { class: "hint", text: "Type d'exercice inconnu." })
      );
    }
  }

  startExercise(activeItem);

  var foot = h("footer", { class: "exercise-foot" });
  foot.appendChild(h("span", { text: "Exercice créé avec l'Atelier HGGSP" }));
  var resetBtn = h("button", {
    class: "btn btn-danger btn-sm",
    type: "button",
    text: "Réinitialiser ma progression",
  });
  resetBtn.addEventListener("click", function () {
    if (storageOk) {
      try {
        window.localStorage.removeItem(LS_KEY);
      } catch (e) {}
    }
    progress = {};
    window.location.reload();
  });
  foot.appendChild(resetBtn);
  wrap.appendChild(foot);

  /* ============================================================
     APPARIEMENT — glisser-déposer HTML5 + sélection au clic/tap
     ============================================================ */
  function initMatching(container) {
    var pairs = (data.pairs || []).filter(function (p) {
      return p && p.a && p.b;
    });
    var total = pairs.length;
    if (!total) {
      container.appendChild(h("p", { class: "hint", text: "Aucune paire à apparier." }));
      setProgressText("");
      return;
    }

    var matched = {};
    var selA = null;
    var selB = null;
    var orderA = shuffle(pairs);
    var orderB = shuffle(pairs);
    var cardsA = {};
    var cardsB = {};

    // Aide mobile : le mode tap (privilégié sur smartphone) est expliqué
    // et suit la sélection en cours.
    var help = h("p", {
      class: "timeline-help matching-help",
      text: "Touchez un élément de gauche, puis l'élément qui lui correspond à droite (ou faites-le glisser).",
    });
    container.appendChild(help);

    var shell = h("div", { class: "matching" });
    var colA = h("div", { class: "matching-col" });
    var colB = h("div", { class: "matching-col" });
    shell.appendChild(colA);
    shell.appendChild(colB);
    container.appendChild(shell);

    function pairText(pid, side) {
      for (var i = 0; i < pairs.length; i++) {
        if (pairs[i].id === pid) return side === "A" ? pairs[i].a : pairs[i].b;
      }
      return "";
    }

    function updateHelp() {
      if (!help) return;
      if (selA && !selB) {
        help.textContent =
          "Élément A choisi : « " +
          pairText(selA, "A") +
          " » — touchez maintenant l'élément associé à droite.";
      } else if (!selA && selB) {
        help.textContent =
          "Élément B choisi : « " +
          pairText(selB, "B") +
          " » — touchez maintenant l'élément associé à gauche.";
      } else {
        help.textContent =
          "Touchez un élément de gauche, puis l'élément qui lui correspond à droite (ou faites-le glisser).";
      }
    }

    function card(pair, side) {
      var c = h("div", {
        class: "dnd-card",
        draggable: "true",
        role: "button",
        tabindex: "0",
        "aria-pressed": "false",
        html: richHtml(side === "A" ? pair.a : pair.b),
      });
      c.setAttribute("data-pair", pair.id);
      c.setAttribute("data-side", side);

      c.addEventListener("dragstart", function (e) {
        e.dataTransfer.setData("text/x-pair", pair.id);
        e.dataTransfer.setData("text/x-side", side);
        e.dataTransfer.effectAllowed = "move";
        c.classList.add("dragging");
      });
      c.addEventListener("dragend", function () {
        c.classList.remove("dragging");
      });
      c.addEventListener("dragover", function (e) {
        if (matched[pair.id]) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        c.classList.add("drop-target");
      });
      c.addEventListener("dragleave", function () {
        c.classList.remove("drop-target");
      });
      c.addEventListener("drop", function (e) {
        e.preventDefault();
        c.classList.remove("drop-target");
        var pid = e.dataTransfer.getData("text/x-pair");
        var pside = e.dataTransfer.getData("text/x-side");
        if (!pid) return;
        var a = pside === "A" ? pid : side === "A" ? pair.id : null;
        var b = pside === "B" ? pid : side === "B" ? pair.id : null;
        if (a && b) selectPair(a, b);
      });
      c.addEventListener("click", function () {
        clickSelect(side, pair.id);
      });
      c.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          clickSelect(side, pair.id);
        }
      });

      if (side === "A") cardsA[pair.id] = c;
      else cardsB[pair.id] = c;
      return c;
    }

    function buildColumns() {
      colA.innerHTML = "";
      colB.innerHTML = "";
      cardsA = {};
      cardsB = {};
      colA.appendChild(h("h2", { text: "Éléments" }));
      colB.appendChild(h("h2", { text: "Associations" }));
      orderA.forEach(function (p) {
        colA.appendChild(card(p, "A"));
      });
      orderB.forEach(function (p) {
        colB.appendChild(card(p, "B"));
      });
      updateHelp();
    }

    function clickSelect(side, pid) {
      if (matched[pid]) return;
      if (side === "A") selA = selA === pid ? null : pid;
      else selB = selB === pid ? null : pid;
      syncClasses();
      if (selA && selB) selectPair(selA, selB);
    }

    function selectPair(a, b) {
      if (a === b) {
        matched[a] = true;
        selA = null;
        selB = null;
        syncClasses();
        if (Object.keys(matched).length === total) complete();
        else updateProgress();
      } else {
        flashWrong(a, "A");
        flashWrong(b, "B");
        selA = null;
        selB = null;
        syncClasses();
      }
    }

    function flashWrong(pid, side) {
      var cardEl = side === "A" ? cardsA[pid] : cardsB[pid];
      if (!cardEl) return;
      cardEl.classList.remove("wrong");
      void cardEl.offsetWidth; // relance l'animation CSS
      cardEl.classList.add("wrong");
      setTimeout(function () {
        cardEl.classList.remove("wrong");
      }, 360);
    }

    function syncClasses() {
      pairs.forEach(function (p) {
        var a = cardsA[p.id];
        var b = cardsB[p.id];
        if (!a || !b) return;
        var m = !!matched[p.id];
        a.classList.toggle("matched", m);
        b.classList.toggle("matched", m);
        a.setAttribute("aria-disabled", String(m));
        b.setAttribute("aria-disabled", String(m));
        a.setAttribute("aria-pressed", String(selA === p.id));
        b.setAttribute("aria-pressed", String(selB === p.id));
        a.classList.toggle("selected", selA === p.id);
        b.classList.toggle("selected", selB === p.id);
      });
      updateHelp();
    }

    function updateProgress() {
      var n = Object.keys(matched).length;
      setProgressText("Appariements : " + n + " / " + total);
    }

    function complete() {
      updateProgress();
      var banner = h("div", {
        class: "banner ok",
        text: "Bravo, toutes les associations sont correctes !",
      });
      var row = h("div", { class: "actions-row" });
      var again = h("button", {
        class: "btn btn-ghost",
        type: "button",
        text: "Recommencer",
      });
      again.addEventListener("click", function () {
        matched = {};
        selA = null;
        selB = null;
        orderA = shuffle(pairs);
        orderB = shuffle(pairs);
        buildColumns();
        updateProgress();
        var b = container.querySelector(".banner");
        if (b) b.remove();
        var r = container.querySelector(".actions-row");
        if (r) r.remove();
      });
      row.appendChild(again);
      container.appendChild(banner);
      container.appendChild(row);
      saveTypeProgress("matching", { completed: true, score: total });
    }

    buildColumns();
    updateProgress();
  }

  /* ============================================================
     FLASHCARDS — recto/verso, statuts ✓ / ~ / ✗
     ============================================================ */
  function initFlashcards(container) {
    var cards = (data.cards || []).filter(function (c) {
      return c && c.question;
    });
    var total = cards.length;
    if (!total) {
      container.appendChild(h("p", { class: "hint", text: "Aucune carte à réviser." }));
      setProgressText("");
      return;
    }

    var statuses = {};
    if (progress.flashcards && typeof progress.flashcards === "object") {
      statuses = progress.flashcards;
    }
    var idx = 0;
    var flipped = false;

    var deck = h("div", { class: "fc-deck" });
    container.appendChild(deck);

    var cardWrap = h("div", {
      class: "fc-card",
      role: "button",
      tabindex: "0",
      "aria-label": "Carte 1",
    });
    var inner = h("div", { class: "fc-inner" });
    cardWrap.appendChild(inner);
    deck.appendChild(cardWrap);

    var controls = h("div", { class: "fc-controls" });
    deck.appendChild(controls);
    var nav = h("div", { class: "fc-nav" });
    deck.appendChild(nav);
    var counter = h("p", { class: "fc-counter" });
    deck.appendChild(counter);

    function statusClass(s) {
      return s === "mastered" ? "mastered" : s === "consolidate" ? "consolidate" : "review";
    }

    function statusLabel(s) {
      if (s === "mastered") return "\u2713 Maîtrisé";
      if (s === "consolidate") return "~ À consolider";
      return "\u2717 À revoir";
    }

    function save() {
      progress.flashcards = statuses;
      progress.completed = Object.keys(statuses).length === total;
      saveProgress(progress);
      updateProgress();
    }

    function render() {
      if (idx >= total) {
        renderSummary();
        return;
      }
      flipped = false;
      cardWrap.classList.remove("flipped");
      controls.style.display = "";
      nav.style.display = "";
      cardWrap.setAttribute("aria-label", "Carte " + (idx + 1) + " sur " + total);
      counter.textContent =
        "Carte " + (idx + 1) + " / " + total + " — cliquez sur la carte pour la retourner";

      var c = cards[idx];
      var badge = statuses[c.id];

      var front = h("div", { class: "fc-face fc-front" });
      front.appendChild(h("span", { class: "fc-hint", text: "Cliquer pour retourner" }));
      front.appendChild(h("h3", { text: "Question" }));
      front.appendChild(h("p", { html: richHtml(c.question) }));
      if (badge) {
        front.appendChild(
          h("span", {
            class: "fc-status-badge " + statusClass(badge),
            text: statusLabel(badge),
          })
        );
      }

      var back = h("div", { class: "fc-face fc-back" });
      back.appendChild(h("h3", { text: "Réponse" }));
      back.appendChild(h("p", { html: richHtml(c.answer) }));
      if (badge) {
        back.appendChild(
          h("span", {
            class: "fc-status-badge " + statusClass(badge),
            text: statusLabel(badge),
          })
        );
      }

      inner.innerHTML = "";
      inner.appendChild(front);
      inner.appendChild(back);
    }

    function renderSummary() {
      flipped = false;
      cardWrap.classList.remove("flipped");
      controls.style.display = "none";
      nav.style.display = "none";
      var m = 0,
        co = 0,
        r = 0;
      Object.keys(statuses).forEach(function (k) {
        var s = statuses[k];
        if (s === "mastered") m++;
        else if (s === "consolidate") co++;
        else if (s === "review") r++;
      });
      counter.textContent =
        "Série terminée — " + m + " maîtrisée(s), " + co + " à consolider, " + r + " à revoir.";

      var panel = h("div", {
        class: "fc-face",
        style:
          "position:static;-webkit-backface-visibility:visible;backface-visibility:visible;",
      });
      panel.appendChild(h("h3", { text: "Récapitulatif de la série" }));
      panel.appendChild(h("p", { text: "Maîtrisées : " + m }));
      panel.appendChild(h("p", { text: "À consolider : " + co }));
      panel.appendChild(h("p", { text: "À revoir : " + r }));
      var restart = h("button", {
        class: "btn btn-primary",
        type: "button",
        text: "Recommencer la série",
      });
      restart.addEventListener("click", function () {
        idx = 0;
        controls.style.display = "";
        nav.style.display = "";
        render();
      });
      panel.appendChild(restart);
      inner.innerHTML = "";
      inner.appendChild(panel);
    }

    cardWrap.addEventListener("click", function () {
      if (idx >= total) return;
      flipped = !flipped;
      cardWrap.classList.toggle("flipped", flipped);
    });
    cardWrap.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        if (idx >= total) return;
        flipped = !flipped;
        cardWrap.classList.toggle("flipped", flipped);
      }
    });

    ["mastered", "consolidate", "review"].forEach(function (status) {
      var b = h("button", {
        class: "fc-status-btn s-" + status,
        type: "button",
        text: statusLabel(status),
      });
      b.addEventListener("click", function () {
        if (idx >= total) return;
        statuses[cards[idx].id] = status;
        save();
        if (idx < total - 1) idx++;
        else idx = total;
        render();
      });
      controls.appendChild(b);
    });

    var prevBtn = h("button", {
      class: "btn btn-ghost btn-sm",
      type: "button",
      text: "← Précédente",
    });
    prevBtn.addEventListener("click", function () {
      if (idx > 0) {
        idx--;
        render();
      }
    });
    nav.appendChild(prevBtn);

    var nextBtn = h("button", {
      class: "btn btn-ghost btn-sm",
      type: "button",
      text: "Suivante →",
    });
    nextBtn.addEventListener("click", function () {
      if (idx < total - 1) idx++;
      else idx = total;
      render();
    });
    nav.appendChild(nextBtn);

    render();
    updateProgress();
  }

  /* ============================================================
     REPÉRAGE SUR CARTE — Leaflet + tuiles OSM, sans clé API
     ============================================================ */
  function initMap(container, cfgArg) {
    var cfg = cfgArg || data.maps[0] || {};
    if (cfg.mode === "image" && cfg.imageDataUrl) {
      initMapImage(container, cfg);
      return;
    }
    var markers = (cfg.markers || []).filter(function (m) {
      return m && typeof m.lat === "number" && typeof m.lng === "number";
    });
    var zones = (cfg.zones || []).filter(function (z) {
      return z && z.shape && Array.isArray(z.geo) && z.geo.length > 0;
    });
    var total = markers.length;
    if ((!total && !zones.length) || typeof L === "undefined") {
      container.appendChild(
        h("p", { class: "hint", text: "Aucun lieu à repérer sur cette carte." })
      );
      setProgressText("");
      return;
    }
    container.className = "map-exercise";

    var mapEl = h("div", {
      class: "map-dark",
      role: "application",
      "aria-label": "Carte interactive — cliquez pour placer les lieux",
    });
    var placesEl = h("div", { class: "places" });
    var statusEl = h("p", { class: "timeline-help", "aria-live": "polite" });
    var actionsEl = h("div", { class: "actions-row" });

    container.appendChild(mapEl);
    container.appendChild(placesEl);
    container.appendChild(statusEl);
    container.appendChild(actionsEl);

    var placed = {};
    var activeId = markers.length ? markers[0].id : null;
    var verified = false;
    var results = {};

    // Zones cliquables transparentes (facultatives) : l'élève clique la zone
    // correspondant au libellé affiché, avant de placer les lieux (s'il y en a).
    var zoneIdx = 0;
    var zoneFound = 0;
    var zoneErrors = 0;
    var phase = zones.length ? "zones" : "markers";

    var map = L.map(mapEl, {
      center: cfg.center || [46.6, 2.4],
      zoom: cfg.zoom || 5,
    });
    currentMap = map; // libéré par startExercise lors d'un changement de type
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution:
        "&copy; <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a>",
      maxZoom: 19,
    }).addTo(map);

    var targetLayer = L.layerGroup().addTo(map);
    var placedLayer = L.layerGroup().addTo(map);
    var zoneLayer = L.layerGroup().addTo(map);

    /* ---------- zones cliquables transparentes (phase 1) ---------- */

    function zoneShapeFor(z) {
      var pts = z.geo;
      var opts = {
        color: "#ffffff",
        weight: 2,
        opacity: 0.3,
        dashArray: "5 6",
        fillColor: "#ffffff",
        fillOpacity: 0.02,
      };
      if (z.shape === "rect" && pts.length >= 2)
        return L.rectangle([pts[0], pts[1]], opts);
      if (z.shape === "circle" && pts.length >= 1)
        return L.circle(pts[0], {
          radius: (z.radiusKm || 10) * 1000,
          color: "#ffffff",
          weight: 2,
          opacity: 0.3,
          dashArray: "5 6",
          fillColor: "#ffffff",
          fillOpacity: 0.02,
        });
      return L.polygon(pts, opts);
    }

    function zoneOnClick(z, sh) {
      if (phase !== "zones" || !zones.length) return;
      if (z.id === zones[zoneIdx].id) {
        zoneFound++;
        sh.setStyle({
          color: "#16a34a",
          weight: 3,
          opacity: 1,
          dashArray: "",
          fillColor: "#16a34a",
          fillOpacity: 0.15,
        });
        sh.unbindTooltip();
        sh.bindTooltip(z.label || "Zone", {
          className: "exercise-tip",
          direction: "top",
          permanent: true,
        });
        zoneIdx++;
        if (zoneIdx >= zones.length) {
          endZones();
          return;
        }
        updateZoneStatus();
      } else {
        zoneErrors++;
        sh.setStyle({
          color: "#ef4444",
          weight: 3,
          opacity: 1,
          dashArray: "",
          fillColor: "#ef4444",
          fillOpacity: 0.12,
        });
        setTimeout(function () {
          if (phase === "zones")
            sh.setStyle({
              color: "#ffffff",
              weight: 2,
              opacity: 0.3,
              dashArray: "5 6",
              fillColor: "#ffffff",
              fillOpacity: 0.02,
            });
        }, 450);
        statusEl.textContent =
          "Ce n'est pas la bonne zone — réessayez : « " +
          (zones[zoneIdx].label || "zone") +
          " »";
      }
      setProgressText("Zones trouvées : " + zoneFound + " / " + zones.length);
    }

    function updateZoneStatus() {
      if (!zones.length || zoneIdx >= zones.length) return;
      statusEl.textContent =
        "Cliquez sur la zone : « " + (zones[zoneIdx].label || "zone") + " »";
      setProgressText("Zones trouvées : " + zoneFound + " / " + zones.length);
    }

    function endZones() {
      phase = "markers";
      statusEl.textContent = "";
      setProgressText("Zones trouvées : " + zoneFound + " / " + zones.length);
      saveTypeProgress("map", { zonesFound: zoneFound, zoneErrors: zoneErrors });
      if (total > 0) {
        var cont = h("button", {
          class: "btn btn-primary",
          type: "button",
          text: "Passer au repérage des lieux",
        });
        cont.addEventListener("click", function () {
          actionsEl.innerHTML = "";
          startMarkerPhase();
        });
        actionsEl.innerHTML = "";
        actionsEl.appendChild(cont);
      } else {
        actionsEl.innerHTML = "";
        actionsEl.appendChild(
          h("div", {
            class: "banner " + (zoneErrors ? "partial" : "ok"),
            text:
              zoneErrors
                ? "Toutes les zones ont été trouvées (" +
                  zoneErrors +
                  " erreur(s))."
                : "Excellent, toutes les zones ont été trouvées !",
          })
        );
      }
    }

    function renderZones() {
      zoneLayer.clearLayers();
      zones.forEach(function (z) {
        var sh = zoneShapeFor(z);
        sh.on("click", function () {
          zoneOnClick(z, sh);
        });
        zoneLayer.addLayer(sh);
      });
    }

    function resetAll() {
      verified = false;
      placed = {};
      activeId = markers.length ? markers[0].id : null;
      results = {};
      targetLayer.clearLayers();
      if (zones.length) {
        zoneIdx = 0;
        zoneFound = 0;
        zoneErrors = 0;
        phase = "zones";
        zoneLayer.clearLayers();
        renderZones();
        actionsEl.innerHTML = "";
        updateZoneStatus();
      } else {
        startMarkerPhase();
      }
    }

    function pinIcon(kind, sym, st) {
      var s = sym || "circle";
      var size = st ? st.size : 22;
      var color = st ? st.color : "#2563eb";
      var opacity = st ? st.opacity : 1;
      var w = st && st.rect ? st.width : size;
      var h = st && st.rect ? st.height : size;
      var html =
        '<div class="pin sym-' +
        s +
        '" style="width:' +
        w +
        "px;height:" +
        h +
        "px;background:" +
        color +
        ";opacity:" +
        opacity +
        ';"></div>';
      return L.divIcon({
        className: "pin-wrap pin-" + kind,
        html: html,
        iconSize: [w + 6, h + 6],
        iconAnchor: [(w + 6) / 2, (h + 6) / 2],
      });
    }

    function labelOf(id) {
      for (var i = 0; i < markers.length; i++) {
        if (markers[i].id === id) return markers[i].label || "";
      }
      return "";
    }

    function updateChips() {
      placesEl.innerHTML = "";
      markers.forEach(function (m) {
        var chip = h("button", { class: "place-chip", type: "button" });
        if (verified) {
          var ok = results[m.id] && results[m.id].ok;
          chip.className += ok ? " ok" : " bad";
          chip.textContent = m.label + " — " + (ok ? "\u2713" : "\u2717");
        } else {
          chip.textContent = m.label;
          if (placed[m.id]) chip.className += " placed";
          if (activeId === m.id) chip.className += " active";
        }
        chip.setAttribute("aria-pressed", String(activeId === m.id));
        chip.addEventListener("click", function () {
          if (verified) return;
          activeId = m.id;
          updateChips();
          updateStatus();
        });
        placesEl.appendChild(chip);
      });
    }

    function renderPlaced() {
      placedLayer.clearLayers();
      Object.keys(placed).forEach(function (id) {
        var ll = placed[id];
        // Retrouve le repère de référence pour afficher son figuré
        // (chaque lieu peut avoir sa propre forme).
        var mdef = null;
        for (var i = 0; i < markers.length; i++) {
          if (markers[i].id === id) {
            mdef = markers[i];
            break;
          }
        }
        var mk = L.marker(ll, {
          icon: pinIcon("student", symbolOf(mdef, cfg), markerStyleOf(mdef)),
          draggable: !verified,
        });
        mk.on("dragend", function () {
          var p = mk.getLatLng();
          placed[id] = [p.lat, p.lng];
        });
        mk.on("click", function () {
          if (verified) return;
          delete placed[id];
          renderPlaced();
          updateChips();
          updateStatus();
        });
        placedLayer.addLayer(mk);
      });
    }

    function updateStatus() {
      var n = Object.keys(placed).length;
      if (verified) {
        statusEl.textContent = "";
        return;
      }
      if (n === total) {
        statusEl.textContent = "Tous les lieux sont placés. Vous pouvez vérifier vos réponses.";
      } else {
        statusEl.textContent =
          "Lieu à placer : « " + labelOf(activeId) + " » — cliquez ou touchez la carte pour le déposer.";
      }
      setProgressText("Lieux placés : " + n + " / " + total);
    }

    map.on("click", function (e) {
      if (phase === "zones") {
        // clic sur le fond (hors zone) : compte comme une erreur
        zoneErrors++;
        setProgressText("Zones trouvées : " + zoneFound + " / " + zones.length);
        return;
      }
      if (verified || !activeId) return;
      placed[activeId] = [e.latlng.lat, e.latlng.lng];
      var next = null;
      for (var i = 0; i < markers.length; i++) {
        if (!placed[markers[i].id] && markers[i].id !== activeId) {
          next = markers[i].id;
          break;
        }
      }
      activeId = next;
      renderPlaced();
      updateChips();
      updateStatus();
    });

    function startMarkerPhase() {
      phase = "markers";
      actionsEl.innerHTML = "";
      var verifyBtn = h("button", {
        class: "btn btn-primary",
        type: "button",
        text: "Vérifier mes réponses",
      });
      verifyBtn.addEventListener("click", function () {
        if (Object.keys(placed).length < total) {
          statusEl.textContent =
            "Il reste " +
            (total - Object.keys(placed).length) +
            " lieu(x) à placer avant de vérifier.";
          return;
        }
        verified = true;
        var okCount = 0;
        results = {};
        markers.forEach(function (m) {
          var p = placed[m.id];
          var dist = distanceKm(p[0], p[1], m.lat, m.lng);
          var ok = dist <= (m.toleranceKm || 25);
          results[m.id] = { ok: ok, dist: dist };
          if (ok) okCount++;
          var col = ok ? "#16a34a" : "#ef4444";
          targetLayer.addLayer(
            L.circle([m.lat, m.lng], {
              radius: (m.toleranceKm || 25) * 1000,
              color: col,
              weight: 2,
              fillColor: col,
              fillOpacity: 0.1,
              dashArray: "6 6",
            })
          );
          targetLayer.addLayer(
            L.marker([m.lat, m.lng], {
              icon: pinIcon("target", symbolOf(m, cfg)),
            }).bindTooltip(m.label + " — position attendue", {
              className: "exercise-tip",
              direction: "top",
            })
          );
        });
        try {
          map.fitBounds(targetLayer.getBounds().pad(0.2), { maxZoom: cfg.zoom });
        } catch (e) {}
        updateChips();
        setProgressText("Score : " + okCount + " / " + total);
        statusEl.textContent = "";

        var banner = h("div", {
          class: "banner " + (okCount === total ? "ok" : "partial"),
          text:
            okCount === total
              ? "Excellent, tous les lieux sont corrects !"
              : okCount +
                " lieu(x) correct(s) sur " +
                total +
                ". En vert : zones correctes. En rouge : zones attendues.",
        });
        actionsEl.innerHTML = "";
        actionsEl.appendChild(banner);
        var again = h("button", {
          class: "btn btn-ghost",
          type: "button",
          text: "Recommencer",
        });
        again.addEventListener("click", function () {
          resetAll();
        });
        actionsEl.appendChild(again);

        var best = progress.map && progress.map.best ? progress.map.best : 0;
        saveTypeProgress("map", {
          completed: okCount === total,
          best: Math.max(best, okCount),
          lastScore: okCount,
        });
      });
      actionsEl.appendChild(verifyBtn);

      renderPlaced();
      updateChips();
      updateStatus();
    }

    if (zones.length) {
      renderZones();
      updateZoneStatus();
    } else {
      startMarkerPhase();
    }
    requestAnimationFrame(function () {
      map.invalidateSize();
    });
  }

  /* ============================================================
     REPÉRAGE SUR FOND DE CARTE IMAGE (fourni par l'enseignant)
     Positions normalisées 0..1 ; tolérance en % de la largeur.
     ============================================================ */
  function initMapImage(container, cfg) {
    var markers = (cfg.markers || []).filter(function (m) {
      return m && typeof m.x === "number" && typeof m.y === "number";
    });
    var zones = (cfg.zones || []).filter(function (z) {
      return z && z.shape && Array.isArray(z.img) && z.img.length > 0;
    });
    var total = markers.length;
    if ((!total && !zones.length) || !cfg.imageDataUrl) {
      container.appendChild(
        h("p", { class: "hint", text: "Aucun lieu à repérer sur cette carte." })
      );
      setProgressText("");
      return;
    }
    container.className = "map-exercise";

    var stage = h("div", {
      class: "map-image-stage",
      role: "application",
      "aria-label": "Fond de carte — cliquez pour placer les lieux",
    });
    if (cfg.imageWidth && cfg.imageHeight) {
      stage.style.aspectRatio = cfg.imageWidth + " / " + cfg.imageHeight;
    }
    var img = h("img", {
      class: "map-image",
      src: cfg.imageDataUrl,
      alt: "Fond de carte de l'exercice",
      draggable: "false",
    });
    stage.appendChild(img);

    var layer = h("div", { class: "map-image-layer" });
    stage.appendChild(layer);
    var zoneLayer = h("div", { class: "map-image-layer map-zones" });
    stage.appendChild(zoneLayer);
    var targetLayer = h("div", { class: "map-image-layer map-targets" });
    stage.appendChild(targetLayer);

    var placesEl = h("div", { class: "places" });
    var statusEl = h("p", { class: "timeline-help", "aria-live": "polite" });
    var actionsEl = h("div", { class: "actions-row" });

    container.appendChild(stage);
    container.appendChild(placesEl);
    container.appendChild(statusEl);
    container.appendChild(actionsEl);

    var placed = {};
    var activeId = markers.length ? markers[0].id : null;
    var verified = false;
    var results = {};
    var pinNodes = {};

    // Zones cliquables transparentes (facultatives), phase 1 de l'exercice.
    var zoneIdx = 0;
    var zoneFound = 0;
    var zoneErrors = 0;
    var phase = zones.length ? "zones" : "markers";

    function labelOf(id) {
      for (var i = 0; i < markers.length; i++) {
        if (markers[i].id === id) return markers[i].label || "";
      }
      return "";
    }

    function posFromEvent(ev) {
      var rect = img.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var x = (ev.clientX - rect.left) / rect.width;
      var y = (ev.clientY - rect.top) / rect.height;
      return {
        x: Math.max(0, Math.min(1, x)),
        y: Math.max(0, Math.min(1, y)),
      };
    }

    function updateChips() {
      placesEl.innerHTML = "";
      markers.forEach(function (m) {
        var chip = h("button", { class: "place-chip", type: "button" });
        if (verified) {
          var ok = results[m.id] && results[m.id].ok;
          chip.className += ok ? " ok" : " bad";
          chip.textContent = m.label + " — " + (ok ? "\u2713" : "\u2717");
        } else {
          chip.textContent = m.label;
          if (placed[m.id]) chip.className += " placed";
          if (activeId === m.id) chip.className += " active";
        }
        chip.setAttribute("aria-pressed", String(activeId === m.id));
        chip.addEventListener("click", function () {
          if (verified) return;
          activeId = m.id;
          updateChips();
          updateStatus();
        });
        placesEl.appendChild(chip);
      });
    }

    function renderPlaced() {
      layer.innerHTML = "";
      pinNodes = {};
      Object.keys(placed).forEach(function (id) {
        var p = placed[id];
        var mk = null;
        for (var i = 0; i < markers.length; i++) {
          if (markers[i].id === id) {
            mk = markers[i];
            break;
          }
        }
        var pin = h("div", {
          class: "pin-img",
          style:
            "left:" + p.x * 100 + "%; top:" + p.y * 100 + "%;",
          role: "button",
          "aria-label": "Lieu placé — cliquer pour retirer",
        });
        var stDot = markerStyleOf(mk);
        pin.appendChild(
          h("span", {
            class: "pin-img-dot sym-" + symbolOf(mk, cfg),
            style:
              "width:" +
              (stDot.rect ? stDot.width : stDot.size) +
              "px;height:" +
              (stDot.rect ? stDot.height : stDot.size) +
              "px;background:" +
              stDot.color +
              ";opacity:" +
              stDot.opacity +
              ";",
            text: "",
          })
        );
        if (!verified) {
          pin.addEventListener("pointerdown", function (ev) {
            ev.stopPropagation();
            if (
              ev.pointerType === "mouse" &&
              ev.button != null &&
              ev.button !== 0
            ) {
              return;
            }
            pin._moved = false;
            try {
              pin.setPointerCapture(ev.pointerId);
            } catch (e) {}
            var startX = ev.clientX;
            var startY = ev.clientY;
            function onMove(ev2) {
              var p2 = posFromEvent(ev2);
              if (!p2) return;
              if (
                Math.abs(ev2.clientX - startX) +
                  Math.abs(ev2.clientY - startY) >
                4
              ) {
                pin._moved = true;
              }
              placed[id] = p2;
              pin.style.left = p2.x * 100 + "%";
              pin.style.top = p2.y * 100 + "%";
            }
            function onUp() {
              pin.removeEventListener("pointermove", onMove);
              pin.removeEventListener("pointerup", onUp);
              pin.removeEventListener("pointercancel", onUp);
              updateStatus();
            }
            pin.addEventListener("pointermove", onMove);
            pin.addEventListener("pointerup", onUp);
            pin.addEventListener("pointercancel", onUp);
          });
          pin.addEventListener("click", function (ev) {
            ev.stopPropagation();
            if (pin._moved) return;
            delete placed[id];
            delete pinNodes[id];
            renderPlaced();
            updateChips();
            updateStatus();
          });
        }
        pinNodes[id] = pin;
        layer.appendChild(pin);
      });
    }

    function updateStatus() {
      var n = Object.keys(placed).length;
      if (verified) {
        statusEl.textContent = "";
        return;
      }
      if (n === total) {
        statusEl.textContent =
          "Tous les lieux sont placés. Vous pouvez vérifier vos réponses.";
      } else {
        statusEl.textContent =
          "Lieu à placer : « " +
          labelOf(activeId) +
          " » — cliquez ou touchez le fond de carte pour le déposer.";
      }
      setProgressText("Lieux placés : " + n + " / " + total);
    }

    /* ---------- zones cliquables transparentes (phase 1) ---------- */

    function zoneDivStyle(z) {
      var pts = z.img;
      var s = "";
      if (z.shape === "rect" && pts.length >= 2) {
        var x0 = Math.min(pts[0].x, pts[1].x) * 100;
        var y0 = Math.min(pts[0].y, pts[1].y) * 100;
        var w = Math.abs(pts[1].x - pts[0].x) * 100;
        var hh = Math.abs(pts[1].y - pts[0].y) * 100;
        s = "left:" + x0 + "%;top:" + y0 + "%;width:" + w + "%;height:" + hh + "%;";
      } else if (z.shape === "circle" && pts.length >= 1) {
        var r = (z.radiusPct || 5) * 2; // diamètre en % de la largeur
        s =
          "left:" + (pts[0].x * 100 - r / 2) +
          "%;top:" + (pts[0].y * 100 - r / 2) +
          "%;width:" + r + "%;height:" + r + "%;border-radius:50%;";
      } else if (z.shape === "polygon" && pts.length >= 3) {
        var poly = pts
          .map(function (p) {
            return p.x * 100 + "% " + p.y * 100 + "%";
          })
          .join(", ");
        s = "inset:0;clip-path:polygon(" + poly + ");";
      }
      return s;
    }

    function zoneOnClick(z, el) {
      if (phase !== "zones" || !zones.length) return;
      if (z.id === zones[zoneIdx].id) {
        zoneFound++;
        el.classList.add("zone-ok");
        el.classList.remove("zone-fade");
        el.setAttribute("data-label", z.label || "Zone");
        zoneIdx++;
        if (zoneIdx >= zones.length) {
          endZones();
          return;
        }
        updateZoneStatus();
      } else {
        zoneErrors++;
        el.classList.add("zone-bad");
        setTimeout(function () {
          if (phase === "zones") el.classList.remove("zone-bad");
        }, 450);
        statusEl.textContent =
          "Ce n'est pas la bonne zone — réessayez : « " +
          (zones[zoneIdx].label || "zone") +
          " »";
      }
      setProgressText("Zones trouvées : " + zoneFound + " / " + zones.length);
    }

    function updateZoneStatus() {
      if (!zones.length || zoneIdx >= zones.length) return;
      statusEl.textContent =
        "Cliquez sur la zone : « " + (zones[zoneIdx].label || "zone") + " »";
      setProgressText("Zones trouvées : " + zoneFound + " / " + zones.length);
    }

    function endZones() {
      phase = "markers";
      statusEl.textContent = "";
      setProgressText("Zones trouvées : " + zoneFound + " / " + zones.length);
      saveTypeProgress("map", { zonesFound: zoneFound, zoneErrors: zoneErrors });
      if (total > 0) {
        var cont = h("button", {
          class: "btn btn-primary",
          type: "button",
          text: "Passer au repérage des lieux",
        });
        cont.addEventListener("click", function () {
          actionsEl.innerHTML = "";
          startMarkerPhase();
        });
        actionsEl.innerHTML = "";
        actionsEl.appendChild(cont);
      } else {
        actionsEl.innerHTML = "";
        actionsEl.appendChild(
          h("div", {
            class: "banner " + (zoneErrors ? "partial" : "ok"),
            text:
              zoneErrors
                ? "Toutes les zones ont été trouvées (" +
                  zoneErrors +
                  " erreur(s))."
                : "Excellent, toutes les zones ont été trouvées !",
          })
        );
      }
    }

    function renderZones() {
      zoneLayer.innerHTML = "";
      zones.forEach(function (z) {
        var el = h("div", {
          class: "map-zone zone-fade",
          style: zoneDivStyle(z),
          role: "button",
          "aria-label": z.label || "Zone",
        });
        el.addEventListener("click", function (ev) {
          ev.stopPropagation();
          zoneOnClick(z, el);
        });
        zoneLayer.appendChild(el);
      });
    }

    function resetAll() {
      verified = false;
      placed = {};
      activeId = markers.length ? markers[0].id : null;
      results = {};
      targetLayer.innerHTML = "";
      if (zones.length) {
        zoneIdx = 0;
        zoneFound = 0;
        zoneErrors = 0;
        phase = "zones";
        renderZones();
        actionsEl.innerHTML = "";
        updateZoneStatus();
      } else {
        startMarkerPhase();
      }
    }

    stage.addEventListener("click", function (e) {
      if (phase === "zones") {
        zoneErrors++;
        setProgressText("Zones trouvées : " + zoneFound + " / " + zones.length);
        return;
      }
      if (verified || !activeId) return;
      var p = posFromEvent(e);
      if (!p) return;
      placed[activeId] = p;
      var next = null;
      for (var i = 0; i < markers.length; i++) {
        if (!placed[markers[i].id] && markers[i].id !== activeId) {
          next = markers[i].id;
          break;
        }
      }
      activeId = next;
      renderPlaced();
      updateChips();
      updateStatus();
    });

    function startMarkerPhase() {
      phase = "markers";
      actionsEl.innerHTML = "";
      var verifyBtn = h("button", {
        class: "btn btn-primary",
        type: "button",
        text: "Vérifier mes réponses",
      });
      verifyBtn.addEventListener("click", function () {
        if (Object.keys(placed).length < total) {
          statusEl.textContent =
            "Il reste " +
            (total - Object.keys(placed).length) +
            " lieu(x) à placer avant de vérifier.";
          return;
        }
        verified = true;
        var okCount = 0;
        results = {};
        markers.forEach(function (m) {
          var p = placed[m.id];
          var dx = p.x - m.x;
          var dy = p.y - m.y;
          var distPct = Math.sqrt(dx * dx + dy * dy) * 100;
          var tol = typeof m.tolerancePct === "number" ? m.tolerancePct : 4;
          var ok = distPct <= tol;
          results[m.id] = { ok: ok, dist: distPct };
          if (ok) okCount++;
          var col = ok ? "#16a34a" : "#ef4444";
          targetLayer.appendChild(
            h("div", {
              class: "map-target-circle",
              style:
                "left:" +
                m.x * 100 +
                "%; top:" +
                m.y * 100 +
                "%; width:" +
                tol * 2 +
                "%; height:" +
                tol * 2 +
                "%; border-color:" +
                col +
                ";",
              "data-label": (m.label || "") + " — position attendue",
            })
          );
        });
        updateChips();
        setProgressText("Score : " + okCount + " / " + total);
        statusEl.textContent = "";

        var banner = h("div", {
          class: "banner " + (okCount === total ? "ok" : "partial"),
          text:
            okCount === total
              ? "Excellent, tous les lieux sont corrects !"
              : okCount +
                " lieu(x) correct(s) sur " +
                total +
                ". En vert : zones correctes. En rouge : zones attendues.",
        });
        actionsEl.innerHTML = "";
        actionsEl.appendChild(banner);
        var again = h("button", {
          class: "btn btn-ghost",
          type: "button",
          text: "Recommencer",
        });
        again.addEventListener("click", function () {
          resetAll();
        });
        actionsEl.appendChild(again);

        var best = progress.map && progress.map.best ? progress.map.best : 0;
        saveTypeProgress("map", {
          completed: okCount === total,
          best: Math.max(best, okCount),
          lastScore: okCount,
        });
      });
      actionsEl.appendChild(verifyBtn);

      renderPlaced();
      updateChips();
      updateStatus();
    }

    if (zones.length) {
      renderZones();
      updateZoneStatus();
    } else {
      startMarkerPhase();
    }
  }

  /* ============================================================
     FRISE CHRONOLOGIQUE — clone du repérage sur carte (fond image)
     L'élève clique/touche le bon endroit sur la frise pour chaque
     événement (tolérance autour de la position attendue), puis la
     bonne zone pour chaque période.
     ============================================================ */
  function initTimeline(container, tlArg) {
    var markers = ((tlArg && tlArg.markers) || []).filter(function (m) {
      return m && typeof m.x === "number" && typeof m.y === "number";
    });
    var zones = ((tlArg && tlArg.zones) || []).filter(function (z) {
      return z && z.shape && Array.isArray(z.img) && z.img.length > 0;
    });
    var total = markers.length;
    if ((!total && !zones.length) || !(tlArg && tlArg.imageDataUrl)) {
      container.appendChild(
        h("p", { class: "hint", text: "Aucun événement à placer sur cette frise." })
      );
      setProgressText("");
      return;
    }
    container.className = "map-exercise";

    var stage = h("div", {
      class: "map-image-stage",
      role: "application",
      "aria-label": "Fond de frise — cliquez pour placer les événements",
    });
    if (tlArg.imageWidth && tlArg.imageHeight) {
      stage.style.aspectRatio = tlArg.imageWidth + " / " + tlArg.imageHeight;
    }
    var img = h("img", {
      class: "map-image",
      src: tlArg.imageDataUrl,
      alt: "Fond de frise de l'exercice",
      draggable: "false",
    });
    stage.appendChild(img);

    var layer = h("div", { class: "map-image-layer" });
    stage.appendChild(layer);
    var zoneLayer = h("div", { class: "map-image-layer map-zones" });
    stage.appendChild(zoneLayer);
    var targetLayer = h("div", { class: "map-image-layer map-targets" });
    stage.appendChild(targetLayer);

    var placesEl = h("div", { class: "places" });
    var statusEl = h("p", { class: "timeline-help", "aria-live": "polite" });
    var actionsEl = h("div", { class: "actions-row" });

    container.appendChild(stage);
    container.appendChild(placesEl);
    container.appendChild(statusEl);
    container.appendChild(actionsEl);

    var placed = {};
    var activeId = markers.length ? markers[0].id : null;
    var verified = false;
    var results = {};
    var pinNodes = {};

    // Zones de période cliquables (facultatives), phase 1 de l'exercice.
    var zoneIdx = 0;
    var zoneFound = 0;
    var zoneErrors = 0;
    var phase = zones.length ? "zones" : "markers";

    function labelOf(id) {
      for (var i = 0; i < markers.length; i++) {
        if (markers[i].id === id) return markers[i].label || "";
      }
      return "";
    }

    // L'année (facultative) n'est jamais affichée pendant l'exercice :
    // elle ne sert qu'après vérification, pour consolider.
    function yearLabel(m) {
      if (m && typeof m.year === "number") {
        return " (" + formatYear(m.year) + ")";
      }
      return "";
    }

    function posFromEvent(ev) {
      var rect = img.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var x = (ev.clientX - rect.left) / rect.width;
      var y = (ev.clientY - rect.top) / rect.height;
      return {
        x: Math.max(0, Math.min(1, x)),
        y: Math.max(0, Math.min(1, y)),
      };
    }

    function updateChips() {
      placesEl.innerHTML = "";
      markers.forEach(function (m) {
        var chip = h("button", { class: "place-chip", type: "button" });
        if (verified) {
          var ok = results[m.id] && results[m.id].ok;
          chip.className += ok ? " ok" : " bad";
          chip.textContent =
            m.label + yearLabel(m) + " — " + (ok ? "✓" : "✗");
        } else {
          chip.textContent = m.label;
          if (placed[m.id]) chip.className += " placed";
          if (activeId === m.id) chip.className += " active";
        }
        chip.setAttribute("aria-pressed", String(activeId === m.id));
        chip.addEventListener("click", function () {
          if (verified) return;
          activeId = m.id;
          updateChips();
          updateStatus();
        });
        placesEl.appendChild(chip);
      });
    }

    function renderPlaced() {
      layer.innerHTML = "";
      pinNodes = {};
      Object.keys(placed).forEach(function (id) {
        var p = placed[id];
        var mk = null;
        for (var i = 0; i < markers.length; i++) {
          if (markers[i].id === id) {
            mk = markers[i];
            break;
          }
        }
        var pin = h("div", {
          class: "pin-img",
          style:
            "left:" + p.x * 100 + "%; top:" + p.y * 100 + "%;",
          role: "button",
          "aria-label": "Événement placé — cliquer pour retirer",
        });
        var stDot = markerStyleOf(mk);
        pin.appendChild(
          h("span", {
            class: "pin-img-dot sym-" + symbolOf(mk, tlArg),
            style:
              "width:" +
              (stDot.rect ? stDot.width : stDot.size) +
              "px;height:" +
              (stDot.rect ? stDot.height : stDot.size) +
              "px;background:" +
              stDot.color +
              ";opacity:" +
              stDot.opacity +
              ";",
            text: "",
          })
        );
        if (!verified) {
          pin.addEventListener("pointerdown", function (ev) {
            ev.stopPropagation();
            if (
              ev.pointerType === "mouse" &&
              ev.button != null &&
              ev.button !== 0
            ) {
              return;
            }
            pin._moved = false;
            try {
              pin.setPointerCapture(ev.pointerId);
            } catch (e) {}
            var startX = ev.clientX;
            var startY = ev.clientY;
            function onMove(ev2) {
              var p2 = posFromEvent(ev2);
              if (!p2) return;
              if (
                Math.abs(ev2.clientX - startX) +
                  Math.abs(ev2.clientY - startY) >
                4
              ) {
                pin._moved = true;
              }
              placed[id] = p2;
              pin.style.left = p2.x * 100 + "%";
              pin.style.top = p2.y * 100 + "%";
            }
            function onUp() {
              pin.removeEventListener("pointermove", onMove);
              pin.removeEventListener("pointerup", onUp);
              pin.removeEventListener("pointercancel", onUp);
              updateStatus();
            }
            pin.addEventListener("pointermove", onMove);
            pin.addEventListener("pointerup", onUp);
            pin.addEventListener("pointercancel", onUp);
          });
          pin.addEventListener("click", function (ev) {
            ev.stopPropagation();
            if (pin._moved) return;
            delete placed[id];
            delete pinNodes[id];
            renderPlaced();
            updateChips();
            updateStatus();
          });
        }
        pinNodes[id] = pin;
        layer.appendChild(pin);
      });
    }

    function updateStatus() {
      var n = Object.keys(placed).length;
      if (verified) {
        statusEl.textContent = "";
        return;
      }
      if (n === total) {
        statusEl.textContent =
          "Tous les événements sont placés. Vous pouvez vérifier vos réponses.";
      } else {
        statusEl.textContent =
          "Événement à placer : « " +
          labelOf(activeId) +
          " » — cliquez ou touchez le fond de frise pour le déposer.";
      }
      setProgressText("Événements placés : " + n + " / " + total);
    }

    /* ---------- zones de période cliquables (phase 1) ---------- */

    function zoneDivStyle(z) {
      var pts = z.img;
      var s = "";
      if (z.shape === "rect" && pts.length >= 2) {
        var x0 = Math.min(pts[0].x, pts[1].x) * 100;
        var y0 = Math.min(pts[0].y, pts[1].y) * 100;
        var w = Math.abs(pts[1].x - pts[0].x) * 100;
        var hh = Math.abs(pts[1].y - pts[0].y) * 100;
        s = "left:" + x0 + "%;top:" + y0 + "%;width:" + w + "%;height:" + hh + "%;";
      } else if (z.shape === "circle" && pts.length >= 1) {
        var r = (z.radiusPct || 5) * 2;
        s =
          "left:" + (pts[0].x * 100 - r / 2) +
          "%;top:" + (pts[0].y * 100 - r / 2) +
          "%;width:" + r + "%;height:" + r + "%;border-radius:50%;";
      } else if (z.shape === "polygon" && pts.length >= 3) {
        var poly = pts
          .map(function (p) {
            return p.x * 100 + "% " + p.y * 100 + "%";
          })
          .join(", ");
        s = "inset:0;clip-path:polygon(" + poly + ");";
      }
      return s;
    }

    function zoneOnClick(z, el) {
      if (phase !== "zones" || !zones.length) return;
      if (z.id === zones[zoneIdx].id) {
        zoneFound++;
        el.classList.add("zone-ok");
        el.classList.remove("zone-fade");
        el.setAttribute("data-label", z.label || "Période");
        zoneIdx++;
        if (zoneIdx >= zones.length) {
          endZones();
          return;
        }
        updateZoneStatus();
      } else {
        zoneErrors++;
        el.classList.add("zone-bad");
        setTimeout(function () {
          if (phase === "zones") el.classList.remove("zone-bad");
        }, 450);
        statusEl.textContent =
          "Ce n'est pas la bonne période — réessayez : « " +
          (zones[zoneIdx].label || "période") +
          " »";
      }
      setProgressText("Périodes trouvées : " + zoneFound + " / " + zones.length);
    }

    function updateZoneStatus() {
      if (!zones.length || zoneIdx >= zones.length) return;
      statusEl.textContent =
        "Cliquez sur la période : « " + (zones[zoneIdx].label || "période") + " »";
      setProgressText("Périodes trouvées : " + zoneFound + " / " + zones.length);
    }

    function endZones() {
      phase = "markers";
      statusEl.textContent = "";
      setProgressText("Périodes trouvées : " + zoneFound + " / " + zones.length);
      saveTypeProgress("timeline", {
        zonesFound: zoneFound,
        zoneErrors: zoneErrors,
      });
      if (total > 0) {
        var cont = h("button", {
          class: "btn btn-primary",
          type: "button",
          text: "Passer au placement des événements",
        });
        cont.addEventListener("click", function () {
          actionsEl.innerHTML = "";
          startMarkerPhase();
        });
        actionsEl.innerHTML = "";
        actionsEl.appendChild(cont);
      } else {
        actionsEl.innerHTML = "";
        actionsEl.appendChild(
          h("div", {
            class: "banner " + (zoneErrors ? "partial" : "ok"),
            text: zoneErrors
              ? "Toutes les périodes ont été trouvées (" + zoneErrors + " erreur(s))."
              : "Excellent, toutes les périodes ont été trouvées !",
          })
        );
      }
    }

    function renderZones() {
      zoneLayer.innerHTML = "";
      zones.forEach(function (z) {
        var el = h("div", {
          class: "map-zone zone-fade",
          style: zoneDivStyle(z),
          role: "button",
          "aria-label": z.label || "Période",
        });
        el.addEventListener("click", function (ev) {
          ev.stopPropagation();
          zoneOnClick(z, el);
        });
        zoneLayer.appendChild(el);
      });
    }

    function resetAll() {
      verified = false;
      placed = {};
      activeId = markers.length ? markers[0].id : null;
      results = {};
      targetLayer.innerHTML = "";
      if (zones.length) {
        zoneIdx = 0;
        zoneFound = 0;
        zoneErrors = 0;
        phase = "zones";
        renderZones();
        actionsEl.innerHTML = "";
        updateZoneStatus();
      } else {
        startMarkerPhase();
      }
    }

    stage.addEventListener("click", function (e) {
      if (phase === "zones") {
        zoneErrors++;
        setProgressText("Périodes trouvées : " + zoneFound + " / " + zones.length);
        return;
      }
      if (verified || !activeId) return;
      var p = posFromEvent(e);
      if (!p) return;
      placed[activeId] = p;
      var next = null;
      for (var i = 0; i < markers.length; i++) {
        if (!placed[markers[i].id] && markers[i].id !== activeId) {
          next = markers[i].id;
          break;
        }
      }
      activeId = next;
      renderPlaced();
      updateChips();
      updateStatus();
    });

    function startMarkerPhase() {
      phase = "markers";
      actionsEl.innerHTML = "";
      var verifyBtn = h("button", {
        class: "btn btn-primary",
        type: "button",
        text: "Vérifier mes réponses",
      });
      verifyBtn.addEventListener("click", function () {
        if (Object.keys(placed).length < total) {
          statusEl.textContent =
            "Il reste " +
            (total - Object.keys(placed).length) +
            " événement(s) à placer avant de vérifier.";
          return;
        }
        verified = true;
        var okCount = 0;
        results = {};
        markers.forEach(function (m) {
          var p = placed[m.id];
          var dx = p.x - m.x;
          var dy = p.y - m.y;
          var distPct = Math.sqrt(dx * dx + dy * dy) * 100;
          var tol = typeof m.tolerancePct === "number" ? m.tolerancePct : 4;
          var ok = distPct <= tol;
          results[m.id] = { ok: ok, dist: distPct };
          if (ok) okCount++;
          var col = ok ? "#16a34a" : "#ef4444";
          targetLayer.appendChild(
            h("div", {
              class: "map-target-circle",
              style:
                "left:" +
                m.x * 100 +
                "%; top:" +
                m.y * 100 +
                "%; width:" +
                tol * 2 +
                "%; height:" +
                tol * 2 +
                "%; border-color:" +
                col +
                ";",
              "data-label": (m.label || "") + yearLabel(m) + " — position attendue",
            })
          );
        });
        updateChips();
        setProgressText("Score : " + okCount + " / " + total);
        statusEl.textContent = "";

        var banner = h("div", {
          class: "banner " + (okCount === total ? "ok" : "partial"),
          text:
            okCount === total
              ? "Excellent, tous les événements sont corrects !"
              : okCount +
                " événement(s) correct(s) sur " +
                total +
                ". En vert : bons repères. En rouge : positions attendues.",
        });
        actionsEl.innerHTML = "";
        actionsEl.appendChild(banner);
        var again = h("button", {
          class: "btn btn-ghost",
          type: "button",
          text: "Recommencer",
        });
        again.addEventListener("click", function () {
          resetAll();
        });
        actionsEl.appendChild(again);

        var best =
          progress.timeline && progress.timeline.best
            ? progress.timeline.best
            : 0;
        saveTypeProgress("timeline", {
          completed: okCount === total,
          best: Math.max(best, okCount),
          lastScore: okCount,
        });
      });
      actionsEl.appendChild(verifyBtn);

      renderPlaced();
      updateChips();
      updateStatus();
    }

    if (zones.length) {
      renderZones();
      updateZoneStatus();
    } else {
      startMarkerPhase();
    }
  }

  function initCloze(container, cloze) {
    var text = (cloze && cloze.text) || "";
    var answers = parseGaps(text);
    var total = answers.length;
    if (!total) {
      container.appendChild(
        h("p", {
          class: "hint",
          text: "Aucun trou à compléter dans ce texte.",
        })
      );
      setProgressText("");
      return;
    }

    // Banque de mots : bonnes réponses (distinctes) + mots pièges.
    var bank = [];
    var seen = {};
    function addWord(w) {
      var k = normWord(w);
      if (!k || seen[k]) return;
      seen[k] = true;
      bank.push({ w: w });
    }
    answers.forEach(addWord);
    ((cloze && cloze.distractors) || []).forEach(addWord);
    bank = shuffle(bank);

    var placed = {}; // index de trou -> index dans bank
    var selected = null;
    var verified = false;
    var results = {};

    var wrap = h("div", { class: "cloze-wrap" });
    container.appendChild(wrap);

    var help = h("p", {
      class: "timeline-help",
      text: "Touchez un mot de la banque, puis l'emplacement du texte où il doit aller (ou faites-le glisser). Touchez un mot placé pour le retirer.",
    });
    wrap.appendChild(help);

    var para = h("p", { class: "cloze-text" });
    var segments = splitGapsText(text);
    var gapEls = {};
    segments.forEach(function (seg) {
      if (seg.type === "text") {
        var sp = document.createElement("span");
        sp.innerHTML = richHtml(seg.s);
        para.appendChild(sp);
      } else {
        var gap = h("button", {
          class: "cloze-gap",
          type: "button",
          role: "button",
          tabindex: "0",
          "aria-label": "Trou numéro " + (seg.index + 1),
        });
        gap.setAttribute("data-gap", seg.index);
        var inner = h("span", {
          class: "cloze-gap-inner",
          text: "\u2026",
        });
        gap.appendChild(inner);

        gap.addEventListener("dragover", function (e) {
          if (verified) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          gap.classList.add("drop-target");
        });
        gap.addEventListener("dragleave", function () {
          gap.classList.remove("drop-target");
        });
        gap.addEventListener("drop", function (e) {
          e.preventDefault();
          gap.classList.remove("drop-target");
          if (verified) return;
          var b = Number(e.dataTransfer.getData("text/x-cloze"));
          if (!isNaN(b) && bank[b]) placeInGap(seg.index, b);
        });
        gap.addEventListener("click", function () {
          if (verified) return;
          if (placed[seg.index] !== undefined) {
            delete placed[seg.index];
            selected = null;
            renderAll();
          } else if (selected !== null) {
            placeInGap(seg.index, selected);
          }
        });
        gap.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            if (verified) return;
            if (placed[seg.index] !== undefined) {
              delete placed[seg.index];
              selected = null;
              renderAll();
            } else if (selected !== null) {
              placeInGap(seg.index, selected);
            }
          }
        });

        para.appendChild(gap);
        gapEls[seg.index] = gap;
      }
    });
    wrap.appendChild(para);

    var bankEl = h("div", {
      class: "cloze-bank",
      role: "group",
      "aria-label": "Banque de mots à placer",
    });
    bank.forEach(function (b, i) {
      var btn = h("button", {
        type: "button",
        class: "cloze-word" + (selected === i ? " selected" : ""),
        draggable: "true",
        tabindex: "0",
        "aria-pressed": String(selected === i),
      });
      btn.setAttribute("data-word", i);
      btn.appendChild(h("span", { html: richHtml(b.w) }));
      btn.addEventListener("dragstart", function (e) {
        e.dataTransfer.setData("text/x-cloze", String(i));
        e.dataTransfer.effectAllowed = "move";
      });
      btn.addEventListener("click", function () {
        selected = selected === i ? null : i;
        renderBank();
      });
      btn.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          selected = selected === i ? null : i;
          renderBank();
        }
      });
      bankEl.appendChild(btn);
    });
    wrap.appendChild(bankEl);

    var statusEl = h("p", {
      class: "timeline-help",
      "aria-live": "polite",
    });
    wrap.appendChild(statusEl);
    var actionsEl = h("div", { class: "actions-row" });
    wrap.appendChild(actionsEl);

    function placeInGap(gapIdx, bankIdx) {
      placed[gapIdx] = bankIdx;
      selected = null;
      renderAll();
    }

    function renderGap(i) {
      var gap = gapEls[i];
      if (!gap) return;
      var inner = gap.querySelector(".cloze-gap-inner");
      var b = placed[i];
      if (b !== undefined && bank[b]) {
        inner.textContent = bank[b].w;
        inner.classList.add("filled");
      } else {
        inner.textContent = "\u2026";
        inner.classList.remove("filled");
      }
      gap.classList.remove("ok", "bad", "drop-target");
      if (verified) {
        gap.classList.add(results[i] ? "ok" : "bad");
        if (!results[i]) inner.textContent = "\u2717 " + answers[i];
      }
    }

    function renderBank() {
      var words = bankEl.querySelectorAll(".cloze-word");
      for (var i = 0; i < words.length; i++) {
        words[i].classList.toggle("selected", selected === i);
        words[i].setAttribute("aria-pressed", String(selected === i));
      }
    }

    function renderAll() {
      Object.keys(gapEls).forEach(function (k) {
        renderGap(Number(k));
      });
      renderBank();
      updateProgress();
    }

    function updateProgress() {
      var n = Object.keys(placed).length;
      setProgressText("Mots placés : " + n + " / " + total);
    }

    function verify() {
      if (Object.keys(placed).length < total) {
        statusEl.textContent =
          "Il reste " +
          (total - Object.keys(placed).length) +
          " mot(s) à placer avant de vérifier.";
        return;
      }
      verified = true;
      var okCount = 0;
      results = {};
      answers.forEach(function (ans, i) {
        var b = placed[i];
        var ok =
          b !== undefined && bank[b] && normWord(bank[b].w) === normWord(ans);
        results[i] = ok;
        if (ok) okCount++;
      });
      renderAll();
      var banner = h("div", {
        class: "banner " + (okCount === total ? "ok" : "partial"),
        text:
          okCount === total
            ? "Excellent, le texte est entièrement correct !"
            : okCount + " mot(s) correct(s) sur " + total + ".",
      });
      actionsEl.innerHTML = "";
      actionsEl.appendChild(banner);
      var again = h("button", {
        class: "btn btn-ghost",
        type: "button",
        text: "Recommencer",
      });
      again.addEventListener("click", function () {
        verified = false;
        placed = {};
        selected = null;
        results = {};
        statusEl.textContent = "";
        actionsEl.innerHTML = "";
        actionsEl.appendChild(verifyBtn);
        renderAll();
      });
      actionsEl.appendChild(again);
      setProgressText("Score : " + okCount + " / " + total);
      var best = progress.cloze && progress.cloze.best ? progress.cloze.best : 0;
      saveTypeProgress("cloze", {
        completed: okCount === total,
        best: Math.max(best, okCount),
        lastScore: okCount,
      });
    }

    var verifyBtn = h("button", {
      class: "btn btn-primary",
      type: "button",
      text: "Vérifier mes réponses",
    });
    verifyBtn.addEventListener("click", verify);
    actionsEl.appendChild(verifyBtn);

    renderAll();
  }
})();
</script>
</body>
</html>
