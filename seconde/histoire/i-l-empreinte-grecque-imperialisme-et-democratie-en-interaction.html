<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Exercice de révision autonome, créé avec l'Atelier HGGSP.">
<title>I. L’empreinte grecque : impérialisme et démocratie en interaction ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Runtime des exercices exportés — feuille de style autonome
   Thème clair moderne : fond Slate 50, cartes blanches,
   accent bleu royal #2563eb. Atkinson Hyperlegible ·
   interligne 1.85 · aucune italique
   ============================================================ */

:root {
  --bg: #f8fafc; /* Slate 50 */
  --bg-raised: #ffffff; /* Pure White */
  --bg-card: #ffffff; /* Pure White */
  --border: #e2e8f0; /* Slate 200 */
  --border-soft: #eef2f7;
  --text: #0f172a; /* Slate 900 */
  --text-dim: #334155; /* Slate 700 */
  --text-faint: #64748b; /* Slate 500 */
  --accent: #2563eb; /* Royal Blue */
  --accent-strong: #1d4ed8;
  --accent-soft: rgba(37, 99, 235, 0.1);
  --red: #dc2626;
  --green: #16a34a;
  --blue: #2563eb;
  --ok: #16a34a;
  --err: #ef4444; /* Red 500 */
  --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.05);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: "Atkinson Hyperlegible", "Arial", sans-serif;
  line-height: 1.85;
  letter-spacing: 0.02em;
  -webkit-font-smoothing: antialiased;
}

h1,
h2,
h3,
h4 {
  line-height: 1.3;
  margin: 0;
  font-weight: 700;
  letter-spacing: 0.01em;
}

p {
  margin: 0 0 0.75em;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.wrap {
  max-width: 940px;
  margin: 0 auto;
  padding: 28px 18px 70px;
}

/* ---------------- En-tête ---------------- */

.exercise-head {
  margin-bottom: 24px;
}

.exercise-head h1 {
  font-size: clamp(1.35rem, 3vw, 1.9rem);
  color: var(--accent);
  margin-bottom: 6px;
}

.instruction {
  color: var(--text-dim);
  max-width: 72ch;
}

.meta-line {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-top: 12px;
}

/* ---------------- Sélecteur d'exercice (le fichier exporté peut
   contenir plusieurs exercices : appariement, flashcards, carte,
   frise). Toujours visible dès qu'au moins un exercice a du contenu. ---------------- */

.type-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 16px 0 2px;
}

.type-tab {
  border: 1px solid var(--border);
  background: var(--bg-raised);
  color: var(--text-dim);
  border-radius: 999px;
  padding: 9px 18px;
  min-height: 46px;
  font-weight: 700;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: border-color 0.15s, color 0.15s, background 0.15s,
    transform 0.1s;
}

.type-tab:hover {
  border-color: var(--accent);
  color: var(--text);
}

.type-tab:active {
  transform: scale(0.98);
}

.type-tab.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #ffffff;
}

.chip-theme {
  padding: 2px 13px;
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.03em;
}

.chip-theme.red {
  color: var(--red);
  border: 1px solid var(--red);
}

.chip-theme.green {
  color: var(--green);
  border: 1px solid var(--green);
}

.chip-theme.blue {
  color: var(--blue);
  border: 1px solid var(--blue);
}

.progress-line {
  margin-left: auto;
  color: var(--text-dim);
  font-size: 0.92rem;
  font-weight: 700;
}

/* ---------------- Boutons ---------------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 8px;
  padding: 9px 16px;
  font-weight: 700;
  border: 1px solid transparent;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}

.btn-primary {
  background: var(--accent);
  color: #ffffff;
}

.btn-primary:hover {
  background: var(--accent-strong);
}

.btn-ghost {
  background: transparent;
  border-color: var(--border);
  color: var(--text);
}

.btn-ghost:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.btn-danger {
  background: transparent;
  border-color: transparent;
  color: var(--err);
}

.btn-danger:hover {
  background: rgba(239, 68, 68, 0.1);
}

.btn-sm {
  padding: 5px 10px;
  font-size: 0.85rem;
  border-radius: 6px;
}

/* ---------------- Notions cliquables ---------------- */

.notion-chip {
  display: inline-block;
  background: var(--accent-soft);
  color: var(--accent);
  border: 1px solid rgba(37, 99, 235, 0.45);
  border-radius: 6px;
  padding: 0 7px;
  font-weight: 700;
  font-size: 0.94em;
  line-height: 1.5;
  transition: background 0.15s;
}

.notion-chip:hover {
  background: rgba(37, 99, 235, 0.16);
}

/* ---------------- Modale notion ---------------- */

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}

.modal {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 14px;
  max-width: 620px;
  width: 100%;
  box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18);
}

.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
}

.modal-head h2 {
  font-size: 1rem;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.modal-body {
  padding: 18px 22px 22px;
}

.modal-term {
  font-size: 1.35rem;
  color: var(--accent);
  margin: 0 0 10px;
}

.modal-label {
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-size: 0.74rem;
  color: var(--text-faint);
  font-weight: 700;
  margin: 14px 0 4px;
}

.modal-body p:last-child {
  margin-bottom: 0;
}

/* ---------------- Appariement ---------------- */

.matching {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
}

.matching-col h2 {
  font-size: 0.95rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-dim);
  margin-bottom: 12px;
}

.matching-col .dnd-list {
  display: grid;
  gap: 10px;
}

.dnd-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 15px;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  box-shadow: var(--shadow-card);
  transition: border-color 0.15s, background 0.15s, opacity 0.15s,
    transform 0.1s;
}

.dnd-card:hover {
  border-color: var(--accent);
}

.dnd-card.selected {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.25);
}

.dnd-card.dragging {
  opacity: 0.4;
}

.dnd-card.drop-target {
  border-color: var(--accent);
  border-style: dashed;
}

.dnd-card.matched {
  border-color: var(--ok);
  background: rgba(22, 163, 74, 0.1);
  cursor: default;
  opacity: 1;
}

.dnd-card.matched::after {
  content: " \2713";
  color: var(--ok);
  font-weight: 700;
}

.dnd-card.wrong {
  border-color: var(--err);
  animation: shake 0.32s;
}

.dnd-card[aria-disabled="true"] {
  opacity: 0.55;
  cursor: default;
}

@keyframes shake {
  0%,
  100% {
    transform: translateX(0);
  }
  25% {
    transform: translateX(-5px);
  }
  75% {
    transform: translateX(5px);
  }
}

/* ---------------- Flashcards ---------------- */

.fc-deck {
  max-width: 660px;
  margin: 0 auto;
}

.fc-card {
  perspective: 1300px;
  cursor: pointer;
}

.fc-inner {
  position: relative;
  width: 100%;
  min-height: 280px;
  transform-style: preserve-3d;
  transition: transform 0.45s;
}

.fc-card.flipped .fc-inner {
  transform: rotateY(180deg);
}

.fc-face {
  position: absolute;
  inset: 0;
  min-height: 280px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 32px 34px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  box-shadow: var(--shadow-card);
  overflow-y: auto;
}

.fc-front .fc-hint {
  position: absolute;
  top: 12px;
  right: 16px;
  color: var(--text-faint);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.fc-back {
  transform: rotateY(180deg);
  border-color: rgba(37, 99, 235, 0.4);
  background: #eff6ff;
}

.fc-face h3 {
  font-size: clamp(1.12rem, 0.8vw + 1rem, 1.35rem);
  color: var(--accent);
  margin-bottom: 12px;
  letter-spacing: 0.02em;
}

/* Texte des cartes : plus grand et plus aéré pour la lecture sur
   smartphone (question et réponse). */
.fc-face p {
  font-size: clamp(1.1rem, 1.2vw + 1rem, 1.38rem);
  line-height: 1.7;
  margin: 0;
  max-width: 46ch;
}

.fc-status-badge {
  position: absolute;
  top: 10px;
  left: 14px;
  font-size: 0.8rem;
  font-weight: 700;
}

.fc-status-badge.mastered {
  color: var(--ok);
}

.fc-status-badge.consolidate {
  color: var(--accent);
}

.fc-status-badge.review {
  color: var(--err);
}

.fc-controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 20px;
}

.fc-status-btn {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 8px 16px;
  font-weight: 700;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}

.fc-status-btn.s-mastered:hover {
  border-color: var(--ok);
  color: var(--ok);
}

.fc-status-btn.s-consolidate:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.fc-status-btn.s-review:hover {
  border-color: var(--err);
  color: var(--err);
}

.fc-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 18px;
  gap: 10px;
}

.fc-counter {
  text-align: center;
  color: var(--text-faint);
  margin-top: 14px;
  font-size: 0.95rem;
}

/* ---------------- Repérage sur carte ---------------- */

.map-exercise {
  display: grid;
  gap: 14px;
}

.map-exercise .leaflet-container {
  border-radius: 12px;
  border: 1px solid var(--border);
  z-index: 0;
}

/* Tuiles OSM standard (aucune clé API) — thème clair */

.leaflet-bar a {
  background: var(--bg-raised) !important;
  color: var(--text) !important;
  border-color: var(--border) !important;
}

.leaflet-control-attribution {
  background: rgba(248, 250, 252, 0.92) !important;
  color: var(--text-faint) !important;
  font-size: 0.68rem !important;
}

.leaflet-control-attribution a {
  color: var(--text-dim) !important;
}

.places {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.place-chip {
  padding: 6px 15px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-dim);
  cursor: pointer;
  font-weight: 700;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}

.place-chip:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.place-chip.active {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
}

.place-chip.placed {
  border-color: var(--blue);
  color: var(--blue);
}

.place-chip.ok {
  border-color: var(--ok);
  color: var(--ok);
  background: rgba(22, 163, 74, 0.1);
}

.place-chip.bad {
  border-color: var(--err);
  color: var(--err);
  background: rgba(239, 68, 68, 0.08);
}

.pin-wrap {
  background: transparent;
  border: none;
}

.pin {
  width: 22px;
  height: 22px;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  border: 2px solid #ffffff;
  background: var(--accent);
  box-shadow: 0 2px 5px rgba(15, 23, 42, 0.3);
}

.pin-wrap.pin-student .pin {
  background: var(--blue);
}

.pin-wrap.pin-target .pin {
  background: var(--err);
}

.leaflet-tooltip.exercise-tip {
  background: var(--bg-raised);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: "Atkinson Hyperlegible", "Arial", sans-serif;
  box-shadow: 0 6px 18px rgba(15, 23, 42, 0.15);
}

/* ---------------- Frise chronologique — fond IMAGE avec emplacements
   fixes (points / barres) positionnés par l'enseignant en % de l'image.
   L'élève dépose chaque étiquette de la banque (glisser-déposer HTML5 ou
   toucher puis toucher). Mobile-first : contacts ≥ 44 px. ---------------- */

.timeline-wrap {
  display: grid;
  gap: 18px;
}

.tl-img-stage {
  position: relative;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--bg-card);
  box-shadow: var(--shadow-card);
  line-height: 0;
}

.tl-img {
  display: block;
  width: 100%;
  height: auto;
  -webkit-user-drag: none;
}

.tl-slot {
  position: absolute;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  border: 3px solid var(--accent-strong);
  background: var(--accent);
  box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.8);
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: box-shadow 0.15s, background 0.15s, border-color 0.15s;
}

.tl-slot.range {
  width: auto;
  height: auto;
  min-height: 26px;
  border-radius: 10px;
  border: 2px dashed var(--accent-strong);
  background: rgba(37, 99, 235, 0.14);
  box-shadow: none;
  transform: none;
}

.tl-slot:hover,
.tl-slot.drop-target {
  box-shadow: 0 0 0 4px var(--accent-soft);
}

.tl-slot:active {
  transform: translate(-50%, -50%) scale(0.94);
}

.tl-slot.range:active {
  transform: scale(0.98);
}

.tl-slot-drop {
  position: absolute;
  left: 50%;
  top: calc(100% + 6px);
  transform: translateX(-50%);
  max-width: min(80vw, 280px);
  background: var(--bg-raised);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 5px 10px;
  font-size: 0.9rem;
  font-weight: 700;
  line-height: 1.35;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  box-shadow: var(--shadow-card);
  pointer-events: none;
}

.tl-slot.range .tl-slot-drop {
  top: auto;
  left: auto;
  right: 4px;
  bottom: calc(100% + 6px);
  transform: none;
  text-align: left;
  white-space: normal;
  max-width: 100%;
}

.tl-slot.ok {
  background: var(--ok);
  border-color: var(--ok);
  box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.35);
}

.tl-slot.range.ok {
  background: rgba(22, 163, 74, 0.22);
}

.tl-slot.bad {
  background: var(--err);
  border-color: var(--err);
  box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.35);
}

.tl-slot.range.bad {
  background: rgba(239, 68, 68, 0.2);
}

.tl-slot.ok .tl-slot-drop {
  border-color: var(--ok);
  color: var(--ok);
}

.tl-slot.bad .tl-slot-drop {
  border-color: var(--err);
  color: var(--err);
}



.tray {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  min-height: 64px;
  border: 1px dashed var(--border);
  border-radius: 12px;
  padding: 14px;
  align-items: center;
}

.tray-label {
  color: var(--text-faint);
  font-size: 0.85rem;
  margin-right: 6px;
}

.tray-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 14px;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  transition: border-color 0.15s, background 0.15s;
}

.tray-card:hover {
  border-color: var(--accent);
}

.tray-card.selected {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.tray-card .tray-date {
  color: var(--text-faint);
  font-size: 0.78rem;
}

.timeline-help {
  color: var(--text-faint);
  font-size: 0.88rem;
}

/* ---------------- Texte à trous ---------------- */

.cloze-wrap {
  display: grid;
  gap: 18px;
}

.cloze-text {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  line-height: 2.1;
  font-size: clamp(1.04rem, 0.6vw + 0.98rem, 1.18rem);
  box-shadow: var(--shadow-card);
  margin: 0;
}

.cloze-gap {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  vertical-align: baseline;
  min-width: 104px;
  min-height: 40px;
  padding: 2px 12px;
  margin: 0 3px;
  border: 2px dashed var(--border);
  border-radius: 999px;
  background: rgba(248, 250, 252, 0.95);
  color: var(--text-faint);
  font-weight: 700;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: border-color 0.15s, background 0.15s, color 0.15s,
    transform 0.1s;
}

.cloze-gap:hover {
  border-color: var(--accent);
}

.cloze-gap:active {
  transform: scale(0.98);
}

.cloze-gap.drop-target {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.cloze-gap.filled {
  border-style: solid;
  border-color: var(--accent);
  color: var(--text);
  background: var(--accent-soft);
}

.cloze-gap.ok {
  border-color: var(--ok);
  color: var(--ok);
  background: rgba(22, 163, 74, 0.1);
}

.cloze-gap.bad {
  border-color: var(--err);
  color: var(--err);
  background: rgba(239, 68, 68, 0.08);
}

.cloze-gap-inner {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 220px;
}

.cloze-bank {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}

.cloze-word {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 10px 18px;
  min-height: 44px;
  font-weight: 700;
  box-shadow: var(--shadow-card);
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: border-color 0.15s, background 0.15s, transform 0.1s;
}

.cloze-word:hover {
  border-color: var(--accent);
}

.cloze-word:active {
  transform: scale(0.98);
}

.cloze-word.selected {
  border-color: var(--accent);
  background: var(--accent-soft);
}

/* ---------------- Résultats & bannières ---------------- */

.banner {
  border-radius: 12px;
  padding: 14px 18px;
  border: 1px solid;
  font-weight: 700;
}

.banner.ok {
  border-color: var(--ok);
  color: var(--ok);
  background: rgba(22, 163, 74, 0.08);
}

.banner.partial {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
}

.results {
  display: grid;
  gap: 10px;
}

.result-item {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 15px;
  background: var(--bg-card);
  box-shadow: var(--shadow-card);
}

.result-item .r-label {
  font-weight: 700;
}

.result-item.ok .r-label {
  color: var(--ok);
}

.result-item.bad .r-label {
  color: var(--err);
}

.result-item .r-why {
  color: var(--text-dim);
  margin-top: 4px;
}

.result-item .r-why strong {
  color: var(--accent);
  font-weight: 700;
}

.actions-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 18px;
}

/* ---------------- Repérage sur fond de carte image ---------------- */

.map-image-stage {
  position: relative;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #eef2f7;
  cursor: crosshair;
  user-select: none;
  -webkit-user-select: none;
}

.map-image {
  display: block;
  width: 100%;
  height: auto;
  -webkit-user-drag: none;
}

.map-image-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.pin-img {
  position: absolute;
  transform: translate(-50%, -50%);
  pointer-events: auto;
  cursor: grab;
  touch-action: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

.pin-img:active {
  cursor: grabbing;
}

.pin-img-dot {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid #ffffff;
  box-shadow: 0 0 0 2px var(--accent-strong);
}

.map-targets .map-target-circle {
  position: absolute;
  transform: translate(-50%, -50%);
  border: 2px dashed var(--ok);
  border-radius: 50%;
  background: rgba(22, 163, 74, 0.08);
  pointer-events: none;
}

.map-targets .map-target-circle::after {
  content: attr(data-label);
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  white-space: nowrap;
  color: var(--text);
  background: rgba(255, 255, 255, 0.95);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 2px 8px;
  font-size: 0.75rem;
}

/* ---------------- Pied ---------------- */

.exercise-foot {
  margin-top: 40px;
  border-top: 1px solid var(--border);
  padding-top: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  color: var(--text-faint);
  font-size: 0.82rem;
}

/* ---------------- Responsive ---------------- */

@media (max-width: 760px) {
  .matching {
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .matching-col .dnd-list {
    gap: 8px;
  }

  .matching-col .dnd-card {
    padding: 12px 10px;
    font-size: 0.95em;
  }

  .wrap {
    padding: 20px 14px 60px;
  }
}

/* ============================================================
   MOBILE-FIRST — les élèves sont majoritairement sur smartphone :
   zones tactiles ≥ 44 px, aucun scroll horizontal, pas de survol
   requis, interactions par tap privilégiées (appariement, frise,
   cartes). Le rendu desktop est ensuite vérifié confortable.
   ============================================================ */

html {
  -webkit-text-size-adjust: 100%;
}

body {
  overflow-x: hidden;
}

.wrap {
  padding: 22px 14px 64px;
}

/* Zones tactiles ≥ 44 px sur tous les éléments interactifs */

.btn {
  min-height: 48px;
  padding: 12px 20px;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.btn-sm {
  min-height: 44px;
  padding: 8px 14px;
}

.dnd-card {
  min-height: 56px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  text-align: left;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.place-chip {
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.tray-card {
  min-height: 52px;
  padding: 10px 16px;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.tl-slot {
  width: 30px;
  height: 30px;
}

.tl-slot.range {
  min-height: 30px;
}

.type-tab {
  min-height: 48px;
}

.cloze-gap {
  min-height: 44px;
}

.cloze-word {
  min-height: 48px;
}

.fc-status-btn {
  min-height: 44px;
  padding: 10px 18px;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.notion-chip {
  min-height: 30px;
  display: inline-flex;
  align-items: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.matching-help {
  margin-bottom: 12px;
}

/* Répère sur fond image : zone de contact ≥ 44 px, déplacement tactile */

.pin-img {
  min-width: 44px;
  min-height: 44px;
  touch-action: none;
}

.pin-img-dot {
  width: 20px;
  height: 20px;
}

/* Carte OSM : hauteur pilotée par la CSS, stable sur mobile et desktop */

.map-exercise .leaflet-container {
  height: 62vw;
  min-height: 320px;
  max-height: 500px;
}

/* Fond image : pas de zoom de page au double-tap */

.map-image-stage {
  touch-action: manipulation;
}

/* Aucun scroll horizontal */

body {
  overflow-x: hidden;
}

.tl-img-stage {
  overflow: hidden;
}

/* Retour visuel tactile — aucun survol requis */

.dnd-card:active,
.place-chip:active,
.tray-card:active,
.fc-status-btn:active,
.btn:active {
  transform: scale(0.98);
}

.dnd-card:active,
.place-chip:active,
.tray-card:active {
  background: var(--accent-soft);
}

.tl-slot:active {
  border-color: var(--accent-strong);
}

.notion-chip:active {
  background: rgba(37, 99, 235, 0.16);
}

/* Contrôles de zoom Leaflet agrandis pour le tactile */

.leaflet-control-zoom a {
  width: 40px !important;
  height: 40px !important;
  line-height: 40px !important;
  font-size: 20px !important;
}

.leaflet-bar {
  border: none !important;
}

/* Cartes flash : hauteur adaptative et plus d'air sur petit écran */

.fc-face {
  padding: 26px 18px;
}

.fc-inner,
.fc-face {
  min-height: min(320px, 52vh);
}

/* Desktop : on vérifie que tout reste lisible et confortable */

@media (min-width: 761px) {
  .wrap {
    padding: 30px 24px 80px;
  }

  .fc-inner,
  .fc-face {
    min-height: 300px;
  }
}

/* ---------------- Figurés des repères (formes) ---------------- */

.pin.sym-circle {
  border-radius: 50%;
  transform: rotate(0deg);
}

.pin.sym-pin {
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
}

.pin.sym-square {
  border-radius: 3px;
  transform: rotate(0deg);
}

.pin.sym-rect {
  border-radius: 3px;
  transform: rotate(0deg);
}

.pin.sym-diamond {
  border-radius: 3px;
  transform: rotate(45deg);
}

.pin.sym-triangle,
.pin.sym-star,
.pin.sym-cross {
  border: none;
  box-shadow: none;
  filter: drop-shadow(0 0 0 2px #ffffff) drop-shadow(0 2px 4px rgba(15, 23, 42, 0.3));
}

.pin.sym-triangle {
  clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
}

.pin.sym-star {
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}

.pin.sym-cross {
  clip-path: polygon(35% 0%, 65% 0%, 65% 35%, 100% 35%, 100% 65%, 65% 65%, 65% 100%, 35% 100%, 35% 65%, 0% 65%, 0% 35%, 35% 35%);
}

.pin-img-dot.sym-circle {
  border-radius: 50%;
}

.pin-img-dot.sym-pin {
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
}

.pin-img-dot.sym-square {
  border-radius: 3px;
}

.pin-img-dot.sym-rect {
  border-radius: 3px;
}

.pin-img-dot.sym-diamond {
  border-radius: 3px;
  transform: rotate(45deg);
}

.pin-img-dot.sym-triangle,
.pin-img-dot.sym-star,
.pin-img-dot.sym-cross {
  border: none;
  box-shadow: none;
  filter: drop-shadow(0 0 0 2px #ffffff);
}

.pin-img-dot.sym-triangle {
  clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
}

.pin-img-dot.sym-star {
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}

.pin-img-dot.sym-cross {
  clip-path: polygon(35% 0%, 65% 0%, 65% 35%, 100% 35%, 100% 65%, 65% 65%, 65% 100%, 35% 100%, 35% 65%, 0% 65%, 0% 35%, 35% 35%);
}

/* ---------------- Zones cliquables transparentes ---------------- */

.map-image-layer.map-zones {
  pointer-events: none;
}

.map-zones .map-zone {
  pointer-events: auto;
}

.map-zone {
  position: absolute;
  cursor: pointer;
  background: rgba(255, 255, 255, 0.02);
  border: 2px dashed rgba(255, 255, 255, 0.4);
  box-sizing: border-box;
  transition: border-color 0.15s, background 0.15s, opacity 0.15s;
}

.map-zone:hover {
  border-color: rgba(255, 255, 255, 0.9);
  background: rgba(255, 255, 255, 0.07);
}

.map-zone.zone-fade {
  opacity: 0.6;
}

.map-zone.zone-ok {
  border: 2px solid #16a34a;
  background: rgba(22, 163, 74, 0.12);
  opacity: 1;
}

.map-zone.zone-ok::after {
  content: attr(data-label);
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  white-space: nowrap;
  color: #ffffff;
  background: rgba(22, 163, 74, 0.85);
  border-radius: 6px;
  padding: 2px 8px;
  font-size: 0.75rem;
  font-weight: 700;
  pointer-events: none;
}

.map-zone.zone-bad {
  border-color: #ef4444;
  background: rgba(239, 68, 68, 0.12);
}

/* ============================================================
   QCM — document (texte ou image) + questions à choix unique
   ============================================================ */

.qcm-wrap {
  max-width: 860px;
}

.qcm-doc {
  margin: 0 0 20px;
}

.qcm-doc-text {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 10px;
  padding: 16px 18px;
  white-space: pre-wrap;
  box-shadow: var(--shadow-card);
}

.qcm-doc-image {
  display: block;
  max-width: 100%;
  max-height: 70vh;
  margin: 0 auto;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg-raised);
  box-shadow: var(--shadow-card);
}

.qcm-doc-caption {
  margin-top: 8px;
  text-align: center;
  color: var(--text-faint);
  font-size: 0.85rem;
}

.qcm-list {
  display: grid;
  gap: 14px;
}

.qcm-question {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
  box-shadow: var(--shadow-card);
}

.qcm-qnum {
  display: inline-block;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 999px;
  padding: 2px 10px;
  margin-bottom: 8px;
}

.qcm-prompt {
  font-weight: 700;
  margin: 0 0 12px;
}

.qcm-options {
  display: grid;
  gap: 8px;
}

.qcm-option {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  width: 100%;
  text-align: left;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 10px 14px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s, transform 0.05s;
}

.qcm-option:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.qcm-option:active {
  transform: scale(0.995);
}

.qcm-option .qcm-option-letter {
  font-weight: 700;
  color: var(--accent);
  flex: 0 0 auto;
}

.qcm-option.selected {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: inset 3px 0 0 var(--accent);
}

.qcm-option.correct {
  border-color: var(--ok);
  background: rgba(22, 163, 74, 0.1);
  box-shadow: inset 3px 0 0 var(--ok);
}

.qcm-option.wrong {
  border-color: var(--err);
  background: rgba(239, 68, 68, 0.1);
  box-shadow: inset 3px 0 0 var(--err);
}

/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {

	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {

	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {

	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {

}
.leaflet-tile {

	}

.leaflet-zoom-box {

/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {

.leaflet-pane         { z-index: 400; }

/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {

.leaflet-left .leaflet-control {

/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {

<script>window.EXERCISE_DATA = {"id":"ex-npkphdbmsd9wrpw","title":"I. L’empreinte grecque : impérialisme et démocratie en interaction ?","instructions":{"matching":"Associez chaque argument / affirmation de la colonne A à l'exemple / preuve historique correspondant dans la colonne B.","flashcards":"Retournez chaque carte pour lire la réponse, puis attribuez un statut : ✓ maîtrisé, ~ à consolider, ✗ à revoir.","map":"Cliquez ou touchez la carte pour placer chaque lieu à l'endroit attendu, puis vérifiez vos réponses.","timeline":"Cliquez sur les dates correspondant aux événements","cloze":"Cliquez sur un mot de la banque, puis sur un emplacement du texte pour le placer (ou glissez-le). Touchez un mot placé pour le retirer.","qcm":"Lisez attentivement le document, puis répondez à chaque question en choisissant une seule proposition."},"themeColor":"green","notions":[{"id":"9130uf6msd9wrpw","term":"Démocratie","definition":"Système politique dans lequel les citoyens sont souverains","context":"Née dans l'antiquité, la démocratie n'est pas un système figé : A Athènes au 5e siècle avant JC la démocratie est différente de la nôtre, par exemple beaucoup d'habitants de la cité sont exclus de la vie politique."},{"id":"d1l15brmsda4maw","term":"isonomie","definition":"Égalité devant la loi","context":"L'isonomie est le fondement de la démocratie athénienne, tous les citoyens, peu importe leur richesse, leur origine ou leur profession ont des droits identiques"},{"id":"mg2f2zmmsgbasrr","term":"Cité","definition":"- Communauté politique autonome composée de citoyens (ex. Athènes).\n- Territoire composée d'une ville et de la campagne environnante","context":""},{"id":"h10jn2hmsgbasrr","term":"Clisthène","definition":"Homme politique athénien à l'origine des réformes de 508-507 av. J.-C. instaurant l'isonomie.","context":"Instaure l'égalité des droits politiques pour les citoyens, posant les bases de la démocratie athénienne."},{"id":"sho05sgmsgbasrr","term":"Ecclésia","definition":"Assemblée de tous les citoyens chargée de voter les lois, de décider de l'ostracisme et de contrôler les magistrats.","context":"Cœur de la démocratie directe où chaque citoyen vote, mais où les orateurs riches exercent une forte influence."},{"id":"0wh5dw9msgbasrr","term":"Boulè","definition":"Conseil de 500 membres tirés au sort chargé de préparer les lois.","context":"Le tirage au sort garantit que chaque citoyen peut participer à la préparation des débats de l'Ecclésia."},{"id":"l4ef5ugmsgbasrr","term":"Héliée","definition":"Tribunal populaire composé de 6 000 membres tirés au sort chargé de rendre la justice.","context":"Permet l'exercice d'une justice populaire sans juges professionnels, incarnant la souveraineté du peuple."},{"id":"ns0afrcmsgbasrr","term":"Périclès","definition":"Homme politique athénien (495-429 av. J.-C.) ayant restreint l'accès à la citoyenneté et instauré le misthos.","context":"Approfondit la démocratie par la rémunération des fonctions tout en divisant par deux le nombre de citoyens."},{"id":"e22yj40msgbasrr","term":"Misthos","definition":"Indemnité financière accordée aux citoyens pour compenser la perte d'une journée de travail lors de la participation politique.","context":"Facilite l'accès des citoyens pauvres aux assemblées, financé en partie grâce au trésor de l'Empire athénien."},{"id":"2v3wxszmsgbasrr","term":"Guerres médiques","definition":"Invasions perses du début du Vᵉ siècle av. J.-C. repoussées par Athènes (Marathon en -490, Salamine en -480).","context":"Victoires militaires d'Athènes apportant un immense prestige et justifiant la création de la Ligue de Délos."},{"id":"t40uq29msgbasrr","term":"Ligue de Délos","definition":"Alliance militaire maritime créée en 478 av. J.-C. sous la direction d'Athènes, convertie en empire maritime.","context":"Alliance défensive transformée par Athènes en instrument de domination et d'enrichissement personnel."},{"id":"mq5ezwgmsgbasrr","term":"Guerre du Péloponnèse","definition":"Conflit opposant Athènes à Sparte (-431 à -404) s'achevant par la défaite d'Athènes.","context":"Défaite provoquant la perte de l'empire maritime et le renversement temporaire de la démocratie."},{"id":"u47edvbmsgbasrr","term":"Oligarchie","definition":"Régime politique dans lequel le pouvoir est détenu par un petit groupe restreint (les plus riches).","context":"Régime imposé à Athènes par deux fois (-411 et -404) avec le soutien de Sparte après les crises militaires."}],"type":"qcm","pairs":[{"id":"nci1anqmsd9wrpw","a":"Athènes est une démocratie imparfaite","b":"Les femmes, les esclaves et les étrangers sont exclus de la vie politique."},{"id":"psgkrt2msd9wrpw","a":"La citoyenneté devient de plus en plus limitée","b":"Périclès impose que la mère d'un citoyen soit fille de citoyen athénien."},{"id":"i1a5cxrmsd9wrpw","a":" Athènes transforme une alliance militaire défensive en un empire maritime sous sa domination.","b":"Athènes s’accapare le trésor de Délos et envoie des soldats contrôler ses alliés."},{"id":"cxzlm9mmsda0cp3","a":"La puissance athénienne repose sur la guerre ","b":"Marathon et Salamine donnent un immense prestige à Athènes"},{"id":"e7z8hy5msg4q88j","a":"La participation de tous les citoyens est encouragée","b":"Le misthos permet aux pauvres de participer sans perdre leur journée de travail."},{"id":"1kmfwoymsj6aoxn","a":"Les défaites militaires fragilisent la démocratie","b":" La défaite face à Sparte entraîne le renversement de la démocratie au profit d'une oligarchie."},{"id":"g8thqb7mskfhpqe","a":"Être citoyen à Athènes suppose des conditions précises","b":"Un citoyen athènien doit être un homme libre, majeur, né à Athènes de parents athéniens."},{"id":"mfcvsr8mskfipoa","a":"Les citoyens disposent de droits politiques","b":"Ils peuvent participer à l'Ecclésia, à la boulè et à l'héliée."},{"id":"i943h8ymskfj4at","a":"Les citoyens ont aussi des devoirs envers la cité","b":"Ils cultivent leur terre, effectuent l'éphébie et financent les liturgies."},{" <script>/* ============================================================
   QCM — DOCUMENT — module autonome (vanilla, sans dépendance).
   Concatené dans le même fichier exporté, juste avant le runtime
   principal. Le document (texte ou image) est affiché, puis
   chaque question à choix unique ; les propositions sont
   mélangées ; une seule bonne réponse par question (correctIndex).
   Les utilitaires internes du runtime principal sont utilisés
   quand ils existent (window.__hggspRt), sinon des équivalents
   locaux prennent le relais.
   ============================================================ */
(function () {
  "use strict";

  var data = window.EXERCISE_DATA || {};
  var rt = window.__hggspRt || {};

  /* ---------- utilitaires (équivalents du runtime principal) ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[c];
    });
  }

  function h(tag, attrs, children) {
    if (rt.h) return rt.h(tag, attrs, children);
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v == null) return;
        if (k === "class") node.className = v;
        else if (k === "text") node.textContent = v;
        else if (k === "html") node.innerHTML = v;
        else node.setAttribute(k, String(v));
      });
    }
    if (children != null) {
      (Array.isArray(children) ? children : [children]).forEach(function (c) {
        if (c == null) return;
        node.appendChild(
          typeof c === "string" ? document.createTextNode(c) : c
        );
      });
    }
    return node;
  }

  function shuffle(arr) {
    if (rt.shuffle) return rt.shuffle(arr);
    var r = arr.slice();
    for (var i = r.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = r[i];
      r[i] = r[j];
      r[j] = tmp;
    }
    return r;
  }

  var notions = (data.notions || []).filter(function (n) {
    return n && n.term;
  });
  var termsSorted = notions.slice().sort(function (a, b) {
    return b.term.length - a.term.length;
  });

  function richHtml(text) {
    if (rt.richHtml) return rt.richHtml(text);
    var s = esc(text);
    if (!termsSorted.length) return s;
    var out = "";
    var i = 0;
    while (i < s.length) {
      var best = null;
      for (var t = 0; t < termsSorted.length; t++) {
        var term = termsSorted[t].term;
        if (!term) continue;
        var idx = s.toLowerCase().indexOf(term.toLowerCase(), i);
        if (idx >= 0 && (best === null || idx < best.idx)) {
          best = { idx: idx, notion: termsSorted[t] };
        }
      }
      if (!best) {
        out += s.slice(i);
        break;
      }
      out += s.slice(i, best.idx);
      out +=
        '<button type="button" class="notion-chip" data-notion="' +
        esc(best.notion.id) +
        '">' +
        esc(best.notion.term) +
        "</button>";
      i = best.idx + best.notion.term.length;
    }
    return out;
  }

  function setProgressText(t) {
    if (rt.setProgressText) {
      rt.setProgressText(t);
      return;
    }
    var el = document.querySelector(".progress-line");
    if (el) el.textContent = t || "";
  }

  var LS_KEY = "hggsp-exercise-" + (data.id || "default");

  function loadProgress() {
    try {
      return JSON.parse(window.localStorage.getItem(LS_KEY) || "{}");
    } catch (e) {
      return {};
    }
  }

  function saveTypeProgress(type, patch) {
    if (rt.saveTypeProgress) {
      rt.saveTypeProgress(type, patch);
      return;
    }
    var p = loadProgress();
    p[type] = Object.assign({}, p[type] || {}, patch);
    try {
      window.localStorage.setItem(LS_KEY, JSON.stringify(p));
    } catch (e) {}
  }

  /* ---------- exercice ---------- */
  function initQcm(container, qcm) {
    // Le runtime principal est chargé quand init() est appelé : on résout
    // alors la référence à ses utilitaires (sinon, équivalents locaux).
    rt = window.__hggspRt || rt;
    // Questions valides : intitulé + au moins 2 propositions + bonne réponse.
    var questions = ((qcm && qcm.questions) || []).filter(function (q) {
      return (
        q &&
        q.prompt &&
        Array.isArray(q.options) &&
        q.options.length >= 2 &&
        typeof q.correctIndex === "number" &&
        q.correctIndex >= 0 &&
        q.correctIndex < q.options.length
      );
    });
    var total = questions.length;
    if (!total) {
      container.appendChild(
        h("p", { class: "hint", text: "Aucune question dans ce QCM." })
      );
      setProgressText("");
      return;
    }

    var wrap = h("div", { class: "qcm-wrap" });
    container.appendChild(wrap);

    // Le document à étudier : image téléchargée ou texte collé.
    if (qcm && qcm.docMode === "image" && qcm.docImageDataUrl) {
      var fig = h("figure", { class: "qcm-doc" });
      var docImg = h("img", {
        class: "qcm-doc-image",
        src: qcm.docImageDataUrl,
        alt: "Document de l'exercice",
        draggable: "false",
      });
      if (qcm.docImageWidth && qcm.docImageHeight) {
        docImg.style.aspectRatio =
          qcm.docImageWidth + " / " + qcm.docImageHeight;
      }
      fig.appendChild(docImg);
      if (qcm.docImageName)
        fig.appendChild(
          h("figcaption", { class: "qcm-doc-caption", text: qcm.docImageName })
        );
      wrap.appendChild(fig);
    } else if (qcm && qcm.docText) {
      var doc = h("div", { class: "qcm-doc qcm-doc-text" });
      doc.innerHTML = richHtml(qcm.docText);
      wrap.appendChild(doc);
    }

    var listEl = h("div", { class: "qcm-list" });
    wrap.appendChild(listEl);
    var statusEl = h("p", { class: "timeline-help", "aria-live": "polite" });
    wrap.appendChild(statusEl);
    var actionsEl = h("div", { class: "actions-row" });
    wrap.appendChild(actionsEl);

    // Ordre mélangé des propositions par question (re-mélangé à chaque
    // « Recommencer »). chosen[qi] = position dans l'ordre mélangé.
    var orders = [];
    var chosen = {};
    var verified = false;
    var results = {};
    var optEls = {}; // "qi:oi" -> bouton de proposition

    function shuffleOptions() {
      orders = questions.map(function (q) {
        var idxs = q.options.map(function (_, i) {
          return i;
        });
        return shuffle(idxs);
      });
    }

    function build() {
      listEl.innerHTML = "";
      optEls = {};
      questions.forEach(function (q, qi) {
        var card = h("div", { class: "qcm-question" });
        card.appendChild(
          h("span", {
            class: "qcm-qnum",
            text: "Question " + (qi + 1) + " / " + total,
          })
        );
        var promptEl = h("p", { class: "qcm-prompt" });
        promptEl.innerHTML = richHtml(q.prompt);
        card.appendChild(promptEl);

        var optsEl = h("div", {
          class: "qcm-options",
          role: "radiogroup",
          "aria-label": "Réponses possibles pour la question " + (qi + 1),
        });
        orders[qi].forEach(function (origIdx, oi) {
          var btn = h("button", {
            type: "button",
            class: "qcm-option",
            role: "radio",
            "aria-checked": "false",
          });
          btn.setAttribute("data-q", qi);
          btn.setAttribute("data-o", oi);
          btn.appendChild(
            h("span", {
              class: "qcm-option-letter",
              text: String.fromCharCode(65 + oi) + ".",
            })
          );
          var txt = h("span", { class: "qcm-option-text" });
          txt.innerHTML = richHtml(q.options[origIdx]);
          btn.appendChild(txt);
          btn.addEventListener("click", function () {
            if (verified) return;
            chosen[qi] = oi;
            renderOptions();
          });
          btn.addEventListener("keydown", function (e) {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              if (verified) return;
              chosen[qi] = oi;
              renderOptions();
            }
          });
          optsEl.appendChild(btn);
          optEls[qi + ":" + oi] = btn;
        });
        card.appendChild(optsEl);
        listEl.appendChild(card);
      });
    }

    function renderOptions() {
      questions.forEach(function (q, qi) {
        orders[qi].forEach(function (origIdx, oi) {
          var btn = optEls[qi + ":" + oi];
          if (!btn) return;
          var isChosen = chosen[qi] === oi;
          var isCorrect = origIdx === q.correctIndex;
          btn.classList.remove("selected", "correct", "wrong");
          btn.setAttribute("aria-checked", String(isChosen));

            if (isCorrect) btn.classList.add("correct");
            else if (isChosen) btn.classList.add("wrong");
          } else if (isChosen) {
            btn.classList.add("selected");
          }
        });
      });
    }

    function updateProgress() {
      var n = Object.keys(chosen).length;
      setProgressText(
        verified
          ? "Score : " + results.score + " / " + total
          : "Questions répondues : " + n + " / " + total
      );
    }

    function verify() {
      if (Object.keys(chosen).length < total) {
        statusEl.textContent =
          "Il reste " +
          (total - Object.keys(chosen).length) +
          " question(s) sans réponse avant de vérifier.";
        return;
      }
      verified = true;
      var okCount = 0;
      results = { score: 0 };
      questions.forEach(function (q, qi) {
        var oi = chosen[qi];
        var ok = orders[qi][oi] === q.correctIndex;
        if (ok) okCount++;
      });
      results.score = okCount;
      renderOptions();
      var banner = h("div", {
        class: "banner " + (okCount === total ? "ok" : "partial"),
        text:
          okCount === total
            ? "Excellent, toutes les réponses sont correctes !"
            : okCount + " bonne(s) réponse(s) sur " + total + ".",
      });
      actionsEl.innerHTML = "";
      actionsEl.appendChild(banner);
      var again = h("button", {
        class: "btn btn-ghost",
        type: "button",
        text: "Recommencer",
      });
      again.addEventListener("click", function () {
        verified = false;
        chosen = {};
        results = {};
        statusEl.textContent = "";
        actionsEl.innerHTML = "";
        actionsEl.appendChild(verifyBtn);
        shuffleOptions();
        build();
        renderOptions();
        updateProgress();
      });
      actionsEl.appendChild(again);
      statusEl.textContent = "";
      updateProgress();
      var prev = loadProgress();
      var best = (prev.qcm && prev.qcm.best) || 0;
      saveTypeProgress("qcm", {
        completed: okCount === total,
        best: Math.max(best, okCount),
        lastScore: okCount,
      });
    }

    var verifyBtn = h("button", {
      class: "btn btn-primary",
      type: "button",
      text: "Vérifier mes réponses",
    });
    verifyBtn.addEventListener("click", verify);
    actionsEl.appendChild(verifyBtn);

    shuffleOptions();
    build();
    renderOptions();
    updateProgress();
  }

  window.__hggspQcm = { init: initQcm };
})();

  var storageOk = (function () {
