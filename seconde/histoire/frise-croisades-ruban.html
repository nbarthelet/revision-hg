<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les croisades — la frise qui se déroule</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9d2c3;--txt:#2a2622;--gold:#d8321f;--dim:#6f675a;--ease:cubic-bezier(.5,0,.2,1);--dur:.9s;--R:38px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at 30% 15%,#e6e0d2 0%,#d9d2c3 55%,#cbc3b1 100%);color:var(--txt);font-family:'Atkinson Hyperlegible',Verdana,Arial,sans-serif;
line-height:1.85;letter-spacing:.02em;font-style:normal;display:flex;flex-direction:column}
em,i{font-style:normal}
header{flex:none;padding:10px 32px 0;display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:1.15rem;color:var(--gold);font-weight:700}
#count{color:var(--dim)}
#progress{flex:none;height:4px;background:#bdb5a3;margin:6px 32px 0;border-radius:2px;overflow:hidden}
#bar{height:100%;width:0;background:var(--gold);transition:width var(--dur) var(--ease)}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;
-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
#world{position:absolute;inset:0 auto 0 0;width:1px;transition:transform var(--dur) var(--ease)}
/* ruban */
#ribbon{position:absolute;left:0;top:42%;height:26px;width:0;overflow:hidden;transition:width var(--dur) var(--ease);
box-shadow:0 8px 14px rgba(80,55,30,.35)}
#fill{position:absolute;left:0;top:0;bottom:0}
#ribbon::after{content:"";position:absolute;inset:0;
background-image:repeating-linear-gradient(90deg,rgba(18,16,14,.6) 0 2px,transparent 2px 24px),
repeating-linear-gradient(90deg,rgba(18,16,14,.6) 0 2px,transparent 2px 120px);
background-size:100% 38%,100% 68%;background-repeat:no-repeat}
#roll{position:absolute;top:calc(42% + 13px - var(--R));left:calc(0px - var(--R));width:calc(var(--R)*2);height:calc(var(--R)*2);
border-radius:50%;
background:repeating-radial-gradient(circle at center,var(--rc,#c8a050) 0 4px,rgba(0,0,0,.4) 4px 5px);
box-shadow:0 10px 18px rgba(80,55,30,.4);
transition:left var(--dur) var(--ease),transform var(--dur) var(--ease);z-index:3}
#roll::before{content:"";position:absolute;left:50%;top:6%;width:5px;height:44%;margin-left:-2.5px;background:rgba(18,16,14,.75);border-radius:3px}
#roll::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;background:var(--bg)}
/* événements */
.ev{position:absolute;top:0;height:100%}
.top{position:absolute;left:0;right:0;bottom:calc(58% + 44px);display:flex;flex-direction:column;align-items:center}
.plabel{color:var(--c);font-size:.8rem;text-transform:uppercase;letter-spacing:.14em;margin-bottom:6px;
opacity:0;transition:opacity .4s}
.ev.cur .plabel{opacity:1;transition-delay:.7s}
.card{background:#f5f1e6;color:#1f1b17;padding:6px 30px 10px;text-align:center;border-radius:4px;
border-bottom:6px solid var(--c);box-shadow:0 16px 30px rgba(80,55,30,.35);max-width:92%;
opacity:0;transform:translateY(-60px) rotate(calc(var(--rot)*3)) scale(.85);
transition:opacity .4s,transform .5s}
.ev.on .card{opacity:.38;transform:rotate(var(--rot))}
.ev.cur .card{opacity:1;transition:opacity .6s .7s,transform .9s cubic-bezier(.2,.9,.25,1.15) .7s}
.date{font-weight:700;line-height:1.15;display:block}
.d-s{font-size:min(12vh,7.5rem)}.d-m{font-size:min(8.5vh,5.2rem)}.d-l{font-size:min(6.5vh,3.8rem)}
.sub{display:block;font-size:min(2.6vh,1.5rem);line-height:1.4;margin-top:2px}
.stem{position:absolute;left:50%;top:calc(42% - 44px);height:44px;width:3px;margin-left:-1.5px;background:var(--c);
transform:scaleY(0);transform-origin:bottom;transition:transform .3s}
.ev.on .stem{transform:scaleY(1);transition-delay:.6s}
.dot{position:absolute;left:50%;top:calc(42% + 13px);width:26px;height:26px;margin:-13px;border-radius:50%;
background:var(--bg);border:5px solid var(--c);transform:scale(0);transition:transform .4s;z-index:2}
.ev.on .dot{transform:scale(1);transition:transform .5s cubic-bezier(.2,1.6,.4,1) .6s}
.ev.cur .dot{background:var(--c);transform:scale(1.35)}
.bot{position:absolute;left:50%;top:calc(42% + 56px);bottom:0;transform:translate(-50%,24px);opacity:0;
transition:opacity .3s,transform .3s;overflow:auto;scrollbar-width:thin}
.ev.cur .bot{opacity:1;transform:translate(-50%,0);transition:opacity .7s 1.1s,transform .7s 1.1s}
.bot p{font-size:min(2.3vh,1.4rem)}
.why{margin-top:10px;padding:6px 18px;border-left:5px solid var(--c);background:rgba(255,255,255,.45);
border-radius:0 8px 8px 0;font-size:min(2.2vh,1.3rem)}
.why b{color:var(--gold)}
/* intro */
#intro{position:absolute;left:5%;top:50%;transform:translateY(-50%);max-width:46%;transition:opacity .6s}
#intro.hide{opacity:0;pointer-events:none}
#intro h2{font-size:min(10vh,5.5rem);line-height:1.1;color:var(--txt)}
#intro .yr{font-size:min(4vh,2.2rem);color:var(--gold);font-weight:700}
#intro p{color:var(--dim);margin-top:12px}
footer{flex:none;padding:4px 32px 10px;display:flex;justify-content:center;gap:12px;align-items:center;color:var(--dim);font-size:.9rem}
button{background:none;border:1px solid var(--gold);color:var(--gold);padding:3px 14px;border-radius:6px;font:inherit;cursor:pointer}
button:hover{background:var(--gold);color:var(--bg)}
button:focus-visible{outline:3px solid var(--txt)}
</style>
</head>
<body>
<header><h1>Les croisades (1095-1291)</h1><div id="count"></div></header>
<div id="progress"><div id="bar"></div></div>
<div id="stage">
 <div id="intro"><h2>Les croisades</h2><div class="yr">1095 → 1291</div><p>Espace ou → pour dérouler la frise</p></div>
 <div id="world">
  <div id="ribbon"><div id="fill"></div></div>
  <div id="roll"></div>
 </div>
</div>
<footer>
<button id="prev">← Précédent</button>
<span>Espace / → : suivant · ← : retour · Début / Fin · F : plein écran</span>
<button id="next">Suivant →</button>
</footer>
<script>
const COL=["#d8321f","#d8321f","#d8321f"];
const PN=["I · Première croisade et États latins","II · Réveil du djihad et Seconde croisade","III · Évolution du concept de croisade"];
const E=[
{p:0,d:"1095",t:"Appel du concile de Clermont",
 x:"Le pape Urbain II invite les chrétiens d’Occident à partir délivrer Jérusalem, la ville sainte.",
 w:"Jérusalem est alors dominée par les musulmans fatimides d’Égypte : le pape veut délivrer les lieux saints."},
{p:0,d:"1096",t:"Départ des croisés",
 x:"De nombreux seigneurs, chevaliers et pèlerins quittent l’Europe.",
 w:"Ils répondent à l’appel d’Urbain II et partent pour un long voyage d’environ trois ans."},
{p:0,d:"1098",t:"Édesse et Antioche",
 x:"Baudouin de Boulogne crée le comté d’Édesse ; Bohémond de Tarente prend Antioche, qui devient une principauté.",
 w:"Les chefs croisés s’installent dans les villes conquises sur la route de Jérusalem."},
{p:0,d:"1099",t:"Prise de Jérusalem",
 x:"Après un siège de cinq semaines, les troupes de Godefroy de Bouillon et de Raymond de Saint-Gilles prennent la ville. Une grande partie de la population musulmane est massacrée. Godefroy devient « avoué du Saint-Sépulcre », protecteur du tombeau du Christ.",
 w:"C’est l’objectif de la croisade : le vœu des croisés est accompli."},
{p:0,d:"1100",t:"Royaume de Jérusalem",
 x:"Baudouin Ier fonde le royaume de Jérusalem.",
 w:"Beaucoup de croisés, estimant leur vœu accompli, rentrent en Occident : il faut organiser la gouvernance des territoires conquis."},
{p:0,d:"1109",t:"Comté de Tripoli",
 x:"Le comté de Tripoli est créé après la mort de Raymond IV de Saint-Gilles. Les quatre États latins d’Orient sont désormais en place.",
 w:"La disparition de Raymond de Saint-Gilles ouvre la voie à la fondation de ce dernier État."},
{p:0,d:"Après 1099",t:"Templiers et Hospitaliers",
 x:"Des moines-soldats vivent selon une règle religieuse mais combattent pour protéger pèlerins et États latins. Ils bâtissent de grandes forteresses, comme le Krak des Chevaliers.",
 w:"Les États latins sont isolés et peu peuplés : il faut les défendre. Les ordres deviennent très puissants grâce à leurs terres et richesses en Europe."},
{p:1,d:"XIIe siècle",t:"Le réveil du djihad",
 x:"Des chefs musulmans relancent l’idée du djihad, combat pour défendre et étendre l’islam. Le monde musulman est divisé, mais Zengi parvient à unir plusieurs régions.",
 w:"La prise de Jérusalem a profondément choqué le monde musulman."},
{p:1,d:"1144",t:"Zengi reprend Édesse",
 x:"Le comté d’Édesse retombe aux mains des musulmans.",
 w:"Grâce à l’union de plusieurs régions, Zengi peut s’attaquer à un État latin : c’est un coup dur pour les croisés."},
{p:1,d:"1146",t:"Appel d’Eugène III",
 x:"Le pape confie la prédication à Bernard de Clairvaux, moine très respecté. Louis VII, roi de France, et Conrad III, empereur germanique, répondent à l’appel.",
 w:"Il faut réagir à la perte d’Édesse."},
{p:1,d:"1147-1149",t:"La Seconde Croisade, un échec",
 x:"Après plusieurs défaites, les armées chrétiennes échouent à prendre Damas en 1148 et doivent se replier.",
 w:"La puissance chrétienne en Orient commence à faiblir, alors que les forces musulmanes s’unissent peu à peu."},
{p:2,d:"1187",t:"Hattin et reprise de Jérusalem",
 x:"La défaite de Hattin détruit l’armée du royaume de Jérusalem ; les prisonniers templiers et hospitaliers sont tués. En octobre, Saladin, sultan qui unit l’Égypte et la Syrie, prend Jérusalem. Il permet de se racheter contre rançon, mais 15 000 pauvres sont réduits en esclavage.",
 w:"Saladin a réuni les forces de l’Égypte et de la Syrie : les croisés ne font plus le poids."},
{p:2,d:"1189-1192",t:"La Troisième Croisade",
 x:"Frédéric Barberousse, Philippe Auguste et Richard Cœur de Lion prennent la tête de l’expédition. Les croisés reprennent Acre en 1191, mais Jérusalem reste musulmane. Une trêve (1192) autorise les pèlerins chrétiens à visiter les lieux saints sans armes.",
 w:"Elle est déclenchée par Hattin et la perte de Jérusalem. Le résultat déçoit beaucoup en Occident."},
{p:2,d:"1202",t:"Détournement vers Zara",
 x:"Lancée par Innocent III pour libérer Jérusalem, la quatrième croisade s’attaque d’abord à Zara, ville chrétienne.",
 w:"Les croisés n’ont pas d’argent pour payer les Vénitiens."},
{p:2,d:"1204",t:"Sac de Constantinople",
 x:"Les croisés prennent et pillent la capitale de l’Empire byzantin. Le schisme entre Églises orientale et occidentale devient définitif. Les Vénitiens s’emparent de ports importants.",
 w:"Il faut payer les dettes. Pour les Byzantins, c’est une humiliation durable et une rupture entre chrétiens d’Orient et d’Occident ; Venise y gagne le contrôle des routes maritimes."},
{p:2,d:"1248-1254",t:"Septième croisade de Saint Louis",
 x:"Louis IX organise une croisade contre l’Égypte.",
 w:"Au XIIIe siècle, Saint Louis veut relancer l’idée de croisade face à la puissance musulmane."},
{p:2,d:"1270",t:"Huitième croisade, à Tunis",
 x:"Son échec marque la fin des grandes croisades royales.",
 w:"Les croisades royales ne parviennent plus à inverser le rapport de force."},
{p:2,d:"1291",t:"Chute d’Acre, fin des États latins",
 x:"Les Mamlûks unifient la Syrie et l’Égypte : Baybars détruit beaucoup de forteresses franques, puis al-Ashraf Khalil prend Acre. Les survivants se réfugient surtout à Chypre, qui devient un centre commercial important.",
 w:"Face à la nouvelle puissance mamlûke, les États latins, isolés et affaiblis, ne peuvent plus tenir."}
];
const $=id=>document.getElementById(id);
const stage=$('stage'),world=$('world'),ribbon=$('ribbon'),fill=$('fill'),roll=$('roll');
const R=38;let slot=0,cur=-1;
const evs=E.map((e,i)=>{
 const el=document.createElement('div');el.className='ev';
 el.style.setProperty('--c',COL[e.p]);
 el.style.setProperty('--rot',(i%2?1:-1)*0.8+'deg');
 const first=i===0||E[i-1].p!==e.p;
 const sz=e.d.length<=4?'d-s':e.d.length<=9?'d-m':'d-l';
 el.innerHTML=`<div class="top">${first?`<span class="plabel">${PN[e.p]}</span>`:'<span class="plabel"></span>'}
 <div class="card"><span class="date ${sz}">${e.d}</span><span class="sub">${e.t}</span></div></div>
 <div class="stem"></div><div class="dot"></div>
 <div class="bot"><p>${e.x}</p><div class="why"><b>Pourquoi ?</b> ${e.w}</div></div>`;
 el.querySelector('.dot').onclick=()=>go(i);
 el.querySelector('.card').onclick=()=>go(i);
 world.appendChild(el);return el;
});
// l'étiquette de partie s'affiche seulement quand on arrive sur la 1re étape d'une partie
function layout(){
 slot=Math.max(640,Math.round(stage.clientWidth*0.72));
 evs.forEach((el,i)=>{el.style.left=(i*slot)+'px';el.style.width=slot+'px';
  el.querySelector('.bot').style.width=Math.min(680,slot-60)+'px';});
 const total=E.length*slot;fill.style.width=total+'px';
 let st=[],prev=0;
 E.forEach((e,i)=>{if(i===E.length-1||E[i+1].p!==e.p){const end=i===E.length-1?total:(i+1)*slot;
  st.push(`${COL[e.p]} ${prev}px`,`${COL[e.p]} ${end}px`);prev=end;}});
 fill.style.background=`linear-gradient(90deg,${st.join(',')})`;
 apply();
}
function apply(){
 const W=stage.clientWidth;
 const endX=cur<0?0:cur*slot+slot/2;
 const focus=cur<0?-W*0.2:endX;
 world.style.transform=`translateX(${W/2-focus}px)`;
 ribbon.style.width=endX+'px';
 roll.style.left=(endX-R)+'px';
 roll.style.transform=`rotate(${endX/(2*Math.PI*R)*360}deg)`;
 roll.style.setProperty('--rc',COL[cur<0?0:E[cur].p]);
 evs.forEach((el,i)=>{el.classList.toggle('on',i<=cur);el.classList.toggle('cur',i===cur);});
 $('intro').classList.toggle('hide',cur>=0);
 $('bar').style.width=((cur+1)/E.length*100)+'%';
 $('count').textContent=cur<0?'':(cur+1)+' / '+E.length;
}
function go(i){cur=Math.max(-1,Math.min(E.length-1,i));apply();}
document.addEventListener('keydown',ev=>{
 if([' ','ArrowRight','ArrowDown','PageDown'].includes(ev.key)){ev.preventDefault();go(cur+1);}
 else if(['ArrowLeft','ArrowUp','PageUp'].includes(ev.key)){ev.preventDefault();go(cur-1);}
 else if(ev.key==='Home')go(-1);
 else if(ev.key==='End')go(E.length-1);
 else if(ev.key==='f'||ev.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
});
$('next').onclick=()=>go(cur+1);$('prev').onclick=()=>go(cur-1);
window.addEventListener('resize',layout);
layout();
</script>
</body>
</html>
